<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNJANG - EXPERT BUY-BACK SUPPORT (FULL SPEC)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #f7f6f3; font-family: 'Pretendard Variable', -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── 상수 정의 ──
        const S = { label: "판매자", bg: "#edf7f1", color: "#15653a", border: "#a3d9b8" };
        const B = { label: "업자",   bg: "#eff3ff", color: "#1d3fac", border: "#a5b8f5" };
        const P = { label: "시스템", bg: "#f3f4f6", color: "#374151", border: "#c9cdd6" };
        const C = { label: "과금",   bg: "#fff8ec", color: "#8a4e00", border: "#f5d09a" };
        const T = { label: "미정",   bg: "#fef9c3", color: "#713f12", border: "#fde047" };
        const PW = 200;

        // ── 공통 UI 컴포넌트 ──
        function Actor({ type, sm }) {
            return <span style={{ display:"inline-flex", alignItems:"center", padding:sm?"2px 7px":"3px 9px", fontSize:sm?10:11, fontWeight:600, letterSpacing:".02em", borderRadius:3, background:type.bg, color:type.color, border:"1px solid "+type.border, whiteSpace:"nowrap", lineHeight:1.5 }}>{type.label}</span>;
        }
        function Chip({ text, color, bg, border }) {
            return <span style={{ display:"inline-block", padding:"2px 7px", fontSize:10, fontWeight:700, letterSpacing:".04em", textTransform:"uppercase", borderRadius:2, background:bg||"#f3f4f6", color:color||"#374151", border:"1px solid "+(border||"#c9cdd6") }}>{text}</span>;
        }
        function Status({ v }) {
            const m = { done:{t:"확정",bg:"#f0fdf4",c:"#166534",b:"#a7f3d0"}, pending:{t:"PENDING",bg:"#fff1f1",c:"#b91c1c",b:"#fca5a5"}, deciding:{t:"TBD",bg:"#fffbeb",c:"#92400e",b:"#fde68a"} }[v]||{t:v,bg:"#f3f4f6",c:"#374151",b:"#c9cdd6"};
            return <Chip text={m.t} color={m.c} bg={m.bg} border={m.b} />;
        }
        function Sec({ title }) { return <div style={{ fontSize:10, fontWeight:700, color:"#6b6860", letterSpacing:".06em", marginBottom:10 }}>{title}</div>; }

        function Phone({ children }) {
            return (
                <div style={{ width:PW, flexShrink:0, background:"#fff", border:"2px solid #1a1917", borderRadius:22, overflow:"hidden", boxShadow:"4px 4px 0 #c9cdd6", alignSelf:"flex-start" }}>
                    <div style={{ background:"#1a1917", padding:"7px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                        <span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>9:41</span>
                        <span style={{ fontSize:7, color:"#aaa", letterSpacing:1 }}>▲▲ ◈ ■</span>
                    </div>
                    {children}
                    <div style={{ height:16, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                        <div style={{ width:40, height:4, background:"#e8e6e0", borderRadius:2 }} />
                    </div>
                </div>
            );
        }

        // ── 스크린 와이어프레임 ──
        function Screen1() {
            return (
                <Phone>
                    <div style={{ padding:"8px 12px 0" }}><span style={{ fontSize:14 }}>‹</span></div>
                    <div style={{ padding:"6px 12px 10px" }}>
                        <div style={{ fontSize:14, fontWeight:800, color:"#1a1917", lineHeight:1.35, marginBottom:4 }}>더 쉬운 거래,<br/>매입 판매로 해결해요</div>
                        <div style={{ fontSize:8.5, color:"#9b9890", marginBottom:10 }}>여러 견적을 제안받고 즉시 판매할 수 있어요.</div>
                        <div style={{ height:52, background:"#f0ede6", borderRadius:8, marginBottom:12 }} />
                        <div style={{ fontSize:10, fontWeight:700, color:"#1a1917", marginBottom:8 }}>견적 신청하기</div>
                        <div style={{ display:"flex", gap:5 }}>
                            {[["👜","명품"],["📱","스마트폰"],["💻","디지털"],["🏍","오토바이"]].map(([e,l]) => (
                                <div key={l} style={{ flex:1, height:46, background:"#f7f6f3", border:"1px solid #e8e6e0", borderRadius:10, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2 }}>
                                    <span style={{ fontSize:14 }}>{e}</span>
                                    <span style={{ fontSize:7, color:"#374151", fontWeight:600 }}>{l}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div style={{ borderTop:"1px solid #e8e6e0", padding:"5px", display:"flex", background:"#fff" }}>
                        <div style={{ flex:1, textAlign:"center", fontSize:6.5 }}>견적신청</div>
                        <div style={{ flex:1, textAlign:"center", fontSize:6.5, color:"#c9cdd6" }}>내 요청서</div>
                    </div>
                </Phone>
            );
        }
        
        function Screen2() {
            return (
                <Phone>
                    <div style={{ padding:"7px 12px 10px", overflowY:"auto", maxHeight:300 }}>
                        <div style={{ fontSize:11, fontWeight:700, margin:"4px 0 8px" }}>견적 정보를 입력해주세요</div>
                        <div style={{ width:36, height:36, background:"#f7f6f3", border:"1px solid #d5d2cb", borderRadius:6, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", marginBottom:8 }}>
                            <span style={{ fontSize:12, color:"#c9cdd6" }}>◎</span>
                        </div>
                        <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6 }}><span style={{ fontSize:8.5, color:"#c9cdd6" }}>브랜드와 모델명 입력</span></div>
                        <div style={{ height:26, background:"#fca5a5", borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9.5, color:"#fff", fontWeight:700 }}>견적 요청하기</span></div>
                    </div>
                </Phone>
            );
        }

        function Screen6() {
            return (
                <Phone>
                    <div style={{ padding:"8px 12px" }}>
                        <div style={{ fontSize:11, fontWeight:700, marginBottom:8 }}>견적 비교</div>
                        <div style={{ border:"1px solid #e8e6e0", borderRadius:8, padding:"7px 9px", marginBottom:6 }}>
                            <div style={{ fontSize:10, fontWeight:700 }}>아르셀</div>
                            <div style={{ fontSize:14, fontWeight:700 }}>2,700,000원</div>
                            <div style={{ flex:1, height:26, background:"#1a1917", borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", marginTop:6 }}><span style={{ fontSize:9, color:"#fff" }}>채팅 문의</span></div>
                        </div>
                    </div>
                </Phone>
            );
        }

        // ── 메인 앱 컴포넌트 ──
        function App() {
            const [tab, setTab] = useState(2); // 통합 플로우 기본값

            // 회의록 데이터
            const sessions = [
                { date:"04.24", title:"번개톡 활용 방식 결정", items:[{text:"매입 거래 전용 소통 채널 필요성 합의",s:"done"},{text:"기존 번개톡 → 매입관 전용 채팅방 신규 구축으로 확정",s:"done"},{text:"매입관 전용 채팅방 구축으로 결정됨에 따라 상세 스펙 정리 필요",s:"pending"}]},
                { date:"04.21", title:"상세기획 3차", items:[{text:"포인트 시스템: 광고 포인트 활용 확정 (C-lab 이력 관리 연동)",s:"done"},{text:"정보 공유 방식 (연락처/주소/계좌): 전용 버튼 카드 방식 확정",s:"done"},{text:"채팅방 비활성화: 거래완료·취소 후 상태 처리 정책 정리 필요",s:"pending"}]},
                { date:"04.15", title:"상세기획 2차 + 운영정책", items:[{text:"입점 허들: 보증보험·계약서 제외, 사후 통제 중심으로 확정",s:"done"},{text:"이용약관: 업자 = 구매자 역할인 특수 케이스 법무 검토 필요",s:"pending"},{text:"제재 기준: '과도한 감액' 등 모호한 기준 정량화 기획 필요",s:"pending"},{text:"연락 두절: 판매자 무응답 시 귀책 제재 조항 별도 검토 예정",s:"pending"}]},
                { date:"04.14", title:"상세기획 1차", items:[{text:"업자 계정 체계: 프로상점 UID에 매입 업자 flag 추가 방식 확정",s:"done"},{text:"슬롯 유효 시간: 72시간으로 확정",s:"done"},{text:"다시 요청하기: 1회 허용, 기존 카드 유지, 기존 업체 자동 제외 확정",s:"done"},{text:"과금 트리거: 견적 제출 500원 + 상담 시작 시 차등 과금 확정",s:"done"}]},
                { date:"04.09", title:"상위기획 공유", items:[{text:"오픈 카테고리: 비상품권 4종 MVP 확정",s:"done"},{text:"서비스 방식: 견적형 (Pay-per-Lead) 확정",s:"done"},{text:"결제/정산: Phase 1 미제공, 거래완료 버튼 트래킹만",s:"done"}]},
            ];

            const docs = [
                { label:"상위기획 Phase 1", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5358977500/Phase+1" },
                { label:"Specdoc — 견적 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5387878717/Specdoc" },
                { label:"Specdoc — 판매자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357764617/Specdoc" },
                { label:"Specdoc — 업자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357600795/Specdoc" },
                { label:"Specdoc — 상담 채팅", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357568021/Specdoc" },
                { label:"Specdoc — 플랫폼 어드민", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357240332/Specdoc" },
            ];

            // 플로우 데이터
            const steps = [
                { n:1, actor:S, title:"매입 홈 진입 → 카테고리 선택", desc:"홈 > 판매탭 진입. 헤더: '더 쉬운 거래, 매입 판매로 해결해요'. 배너 + 카테고리 그리드.", screen:<Screen1 /> },
                { n:2, actor:S, title:"견적 폼 작성", desc:"카테고리별 특화 폼 제공. 사진(최소 1장), 브랜드/모델명, 상세정보 필수.", 
                  extra: (
                    <div style={{ marginTop:8, border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden" }}>
                        <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 1fr", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                            {["카테고리","항목","입력 방식"].map(h => <div key={h} style={{ padding:"5px 8px", fontSize:10, fontWeight:600 }}>{h}</div>)}
                        </div>
                        {[["스마트폰","용량","64/128/256/512GB/1TB"],["","A/S 여부","공식/사설"],["명품","구성품","박스/보증서/더스트백"],["오토바이","연식","연도 선택"],["","주행거리","숫자 입력"]].map(([c,k,v],i) => (
                            <div key={i} style={{ display:"grid", gridTemplateColumns:"72px 1fr 1fr", borderBottom:"1px solid #f0ede6", background:"#fff" }}>
                                <div style={{ padding:"4px 8px", fontSize:10, fontWeight:c?"600":"400" }}>{c||"ㅤ"}</div>
                                <div style={{ padding:"4px 8px", fontSize:10 }}>{k}</div>
                                <div style={{ padding:"4px 8px", fontSize:10, color:"#6b6860" }}>{v}</div>
                            </div>
                        ))}
                    </div>
                  ),
                  notes:["사진: 최소 1장, 최대 10장.","유효성: 필수값 미입력 시 요청 버튼 비활성."], screen:<Screen2 /> 
                },
                { n:3, actor:P, title:"슬롯 활성화 + 알림 발송", desc:"요청 즉시 슬롯 10개 활성화, 72h 카운트다운 시작. 업자 전원 푸시.", screen:<div style={{width:PW,height:50,background:"#f7f6f3",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>알림 푸시</div> },
                { n:4, actor:B, title:"가견적 입력 → 전송", cost:true, desc:"업자 홈에서 요청 확인 및 가견적 전송.", screen:<div style={{width:PW,height:50,background:"#f7f6f3",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>가견적 입력</div> },
                { n:6, actor:S, title:"견적 비교 → 상담 선택", cost:true, desc:"가견적가 비교 후 채팅 문의 시작. 과금 발생.", 
                  extra: (
                    <div style={{ border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden", fontSize:11, marginTop:8 }}>
                        <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                            {["카테고리","항목","과금액"].map(h => <div key={h} style={{ padding:"5px 8px", fontSize:10, fontWeight:600 }}>{h}</div>)}
                        </div>
                        {[["오토바이","전 기종","50,000원"],["스마트폰","전 기종","10,000원"],["명품","1000만원↑","100,000원"]].map(([c,k,v],i) => (
                            <div key={i} style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", borderBottom:"1px solid #f0ede6", background:"#fff" }}>
                                <div style={{ padding:"5px 8px" }}>{c}</div>
                                <div style={{ padding:"5px 8px" }}>{k}</div>
                                <div style={{ padding:"5px 8px", fontWeight:700 }}>{v}</div>
                            </div>
                        ))}
                    </div>
                  ),
                  notes:["취소 사유: 수정 필요 / 변심 / 견적가 불만 등"], screen:<Screen6 /> 
                },
                { n:7, actor:T, title:"채팅방 생성", desc:"매입 전용 플래그 채팅방 생성. 매물 카드 고정.", screen:<div style={{width:PW,height:50,background:"#fef9c3",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>TBD: 채팅방</div> },
                { n:10, actor:S, title:"후기 작성", desc:"긍정 키워드 기반 후기 작성.", screen:<div style={{width:PW,height:50,background:"#f7f6f3",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10}}>후기 남기기</div> }
            ];

            const pendingItems = sessions.flatMap(x => x.items.filter(i => i.s==="pending"));

            return (
                <div style={{ minHeight:"100vh" }}>
                    <div style={{ background:"#1a1917", color:"#fff", padding:"16px 20px 0" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", marginBottom:15 }}>
                            <div>
                                <div style={{ fontSize:10, color:"#9b9890" }}>BUNJANG BUY-BACK PROJECT</div>
                                <div style={{ fontSize:19, fontWeight:700 }}>매입지원 서비스 기획 상세 대시보드</div>
                            </div>
                            <Chip text="PHASE 1" color="#fff" bg="#333" />
                        </div>
                        <div style={{ display:"flex", gap:2 }}>
                            {["회의록","MVP 스코프","통합 플로우","채팅 스펙"].map((l,i) => (
                                <button key={i} onClick={() => setTab(i)} style={{ padding:"10px 15px", border:"none", borderRadius:"5px 5px 0 0", background:tab===i?"#f7f6f3":"transparent", color:tab===i?"#000":"#999", cursor:"pointer", fontSize:12 }}>{l}</button>
                            ))}
                        </div>
                    </div>

                    <div style={{ maxWidth:980, margin:"20px auto", padding:"0 18px" }}>
                        {tab === 0 && (
                            <div>
                                <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", marginBottom:20 }}>
                                    <div style={{ padding:"8px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontSize:10, fontWeight:700 }}>기획서 링크 — Confluence</div>
                                    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#fff" }}>
                                        {docs.map((d,i) => (
                                            <a key={i} href={d.url} target="_blank" rel="noopener noreferrer" style={{ display:"flex", alignItems:"center", gap:6, padding:"10px 14px", borderBottom:"1px solid #f0ede6", borderRight:"1px solid #f0ede6", color:"#1d3fac", fontSize:11, fontWeight:500 }}>
                                                <span style={{ color:"#9b9890" }}>↗</span> {d.label}
                                            </a>
                                        ))}
                                    </div>
                                </div>
                                <div style={{ background:"#fff8ec", border:"1px solid #f5d09a", borderRadius:6, padding:"12px 14px", marginBottom:20 }}>
                                    <div style={{ fontSize:10, fontWeight:700, color:"#8a4e00", marginBottom:8 }}>PENDING — 미결 항목 ({pendingItems.length}건)</div>
                                    {pendingItems.map((p,i) => <div key={i} style={{ fontSize:12, marginBottom:4 }}>• {p.text}</div>)}
                                </div>
                                {sessions.map((s,si) => (
                                    <div key={si} style={{ marginBottom:12, border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
                                        <div style={{ padding:"9px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontWeight:600 }}>{s.date} {s.title}</div>
                                        {s.items.map((item,ii) => (
                                            <div key={ii} style={{ padding:"8px 14px", display:"flex", gap:10, borderBottom:"1px solid #f0ede6" }}>
                                                <Status v={item.s} /><span style={{ fontSize:13 }}>{item.text}</span>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        )}

                        {tab === 2 && (
                            <div style={{ position:"relative" }}>
                                <div style={{ position:"absolute", left:19, top:0, bottom:0, width:1, background:"#e8e6e0" }} />
                                {steps.map((s) => (
                                    <div key={s.n} style={{ display:"flex", gap:12, position:"relative", zIndex:1, marginBottom:20 }}>
                                        <div style={{ width:40, height:40, borderRadius:"50%", flexShrink:0, marginTop:6, display:"flex", alignItems:"center", justifyContent:"center", background:s.actor.bg, border:"1.5px solid "+s.actor.border, fontWeight:700 }}>{s.n}</div>
                                        <div style={{ flex:1, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", overflow:"hidden" }}>
                                            <div style={{ padding:"9px 14px", borderBottom:"1px solid #f0ede6", display:"flex", alignItems:"center", gap:8 }}>
                                                <Actor type={s.actor} sm /> <span style={{ fontWeight:600 }}>{s.title}</span>
                                                {s.cost && <Chip text="과금" color={C.color} bg={C.bg} border={C.border} />}
                                            </div>
                                            <div style={{ padding:"12px 14px", display:"flex", gap:16 }}>
                                                <div style={{ flex:1 }}>
                                                    <p style={{ fontSize:12, lineHeight:1.7, margin:0 }}>{s.desc}</p>
                                                    {s.extra}
                                                    {s.notes && <div style={{ marginTop:8 }}>{s.notes.map((n,i) => <div key={i} style={{ fontSize:11, color:"#374151" }}>▸ {n}</div>)}</div>}
                                                </div>
                                                {s.screen}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                        {/* 나머지 탭 생략 (공간상 통합 플로우 위주 복구) */}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
