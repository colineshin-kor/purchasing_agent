<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNJANG - EXPERT BUY-BACK SUPPORT (Full Content)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #f7f6f3; font-family: 'Pretendard Variable', -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── 상수 정의 ──
        const S = { label: "판매자", bg: "#edf7f1", color: "#15653a", border: "#a3d9b8" };
        const B = { label: "업자",   bg: "#eff3ff", color: "#1d3fac", border: "#a5b8f5" };
        const P = { label: "시스템", bg: "#f3f4f6", color: "#374151", border: "#c9cdd6" };
        const C = { label: "과금",   bg: "#fff8ec", color: "#8a4e00", border: "#f5d09a" };
        const T = { label: "미정",   bg: "#fef9c3", color: "#713f12", border: "#fde047" };
        const PW = 200;

        // ── 공통 UI 컴포넌트 ──
        function Actor({ type, sm }) {
          return <span style={{ display:"inline-flex", alignItems:"center", padding:sm?"2px 7px":"3px 9px", fontSize:sm?10:11, fontWeight:600, letterSpacing:".02em", borderRadius:3, background:type.bg, color:type.color, border:"1px solid "+type.border, whiteSpace:"nowrap", lineHeight:1.5 }}>{type.label}</span>;
        }
        function Chip({ text, color, bg, border }) {
          return <span style={{ display:"inline-block", padding:"2px 7px", fontSize:10, fontWeight:700, letterSpacing:".04em", textTransform:"uppercase", borderRadius:2, background:bg||"#f3f4f6", color:color||"#374151", border:"1px solid "+(border||"#c9cdd6") }}>{text}</span>;
        }
        function Status({ v }) {
          const m = { done:{t:"확정",bg:"#f0fdf4",c:"#166534",b:"#a7f3d0"}, pending:{t:"PENDING",bg:"#fff1f1",c:"#b91c1c",b:"#fca5a5"}, deciding:{t:"TBD",bg:"#fffbeb",c:"#92400e",b:"#fde68a"} }[v]||{t:v,bg:"#f3f4f6",c:"#374151",b:"#c9cdd6"};
          return <Chip text={m.t} color={m.c} bg={m.bg} border={m.b} />;
        }
        function Sec({ title }) { return <div style={{ fontSize:10, fontWeight:700, color:"#6b6860", letterSpacing:".06em", marginBottom:10 }}>{title}</div>; }

        // ── Wireframe primitives ──
        function Phone({ children }) {
          return (
            <div style={{ width:PW, flexShrink:0, background:"#fff", border:"2px solid #1a1917", borderRadius:22, overflow:"hidden", boxShadow:"4px 4px 0 #c9cdd6", alignSelf:"flex-start" }}>
              <div style={{ background:"#1a1917", padding:"7px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>9:41</span>
                <span style={{ fontSize:7, color:"#aaa", letterSpacing:1 }}>▲▲ ◈ ■</span>
              </div>
              {children}
              <div style={{ height:16, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <div style={{ width:40, height:4, background:"#e8e6e0", borderRadius:2 }} />
              </div>
            </div>
          );
        }
        function PhoneTabs({ tabs, active, onSelect }) {
          return (
            <div style={{ display:"flex", borderBottom:"1px solid #e8e6e0", marginBottom:8 }}>
              {tabs.map(t => <div key={t} onClick={() => onSelect(t)} style={{ flex:1, textAlign:"center", padding:"6px 0", fontSize:9, fontWeight:active===t?700:400, color:active===t?"#1a1917":"#9b9890", borderBottom:active===t?"2px solid #1a1917":"2px solid transparent", cursor:"pointer" }}>{t}</div>)}
            </div>
          );
        }
        function WRect({ h=16, label, dashed=false, fill="#f7f6f3", color="#9b9890", mb=6, radius=4 }) {
          return <div style={{ height:h, background:fill, border:"1px "+(dashed?"dashed":"solid")+" #d5d2cb", borderRadius:radius, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:mb }}>{label && <span style={{ fontSize:8.5, color, fontWeight:500, textAlign:"center", lineHeight:1.3, padding:"0 5px" }}>{label}</span>}</div>;
        }
        function WBtn({ label, primary=false, flex=1, disabled=false, red=false }) {
          const bg = disabled?"#f0ede6" : red?"#e53935" : primary?"#1a1917":"#f7f6f3";
          const bc = disabled?"#d5d2cb" : red?"#e53935" : primary?"#1a1917":"#d5d2cb";
          const tc = disabled?"#c9cdd6" : (primary||red)?"#fff":"#374151";
          return <div style={{ flex, height:26, background:bg, border:"1px solid "+bc, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", cursor:disabled?"default":"pointer" }}><span style={{ fontSize:9, color:tc, fontWeight:700 }}>{label}</span></div>;
        }
        function WLabel({ text }) { return <div style={{ fontSize:9, color:"#9b9890", marginBottom:4 }}>{text}</div>; }
        function WDivider({ my=6 }) { return <div style={{ borderTop:"1px solid #f0ede6", margin:`${my}px 0` }} />; }
        function WInput({ placeholder }) {
          return <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6 }}><span style={{ fontSize:8.5, color:"#c9cdd6" }}>{placeholder}</span></div>;
        }
        function WQty() {
          return (
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ fontSize:9, fontWeight:600, color:"#1a1917" }}>수량</span>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9 }}>−</span></div>
                <span style={{ fontSize:9, fontWeight:600 }}>1개</span>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9 }}>+</span></div>
              </div>
            </div>
          );
        }
        function BottomBar({ active }) {
          return (
            <div style={{ borderTop:"1px solid #e8e6e0", padding:"5px 4px 2px", display:"flex", background:"#fff" }}>
              {["←", "+", "≡", "♡"].map((icon, i) => (
                <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center" }}>
                   <div style={{ fontSize:10, color: i===1?"#1a1917":"#c9cdd6" }}>{icon}</div>
                </div>
              ))}
            </div>
          );
        }

        // ── Screens (전체 복구) ──
        function Screen1() {
          return (
            <Phone>
              <div style={{ padding:"8px 12px" }}>
                <div style={{ fontSize:14, fontWeight:800, marginBottom:4 }}>더 쉬운 거래,<br/>매입 판매로 해결해요</div>
                <div style={{ height:52, background:"#f0ede6", borderRadius:8, marginBottom:12 }} />
                <div style={{ display:"flex", gap:5 }}>
                  {["명품", "폰", "디지털", "바이크"].map(l => (
                    <div key={l} style={{ flex:1, height:40, background:"#f7f6f3", borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", fontSize:7, fontWeight:600 }}>{l}</div>
                  ))}
                </div>
              </div>
              <BottomBar active="quote" />
            </Phone>
          );
        }
        function Screen2() {
          return (
            <Phone>
              <div style={{ padding:"10px 12px" }}>
                <WLabel text="사진 등록 *" /><WRect h={36} label="◎ 0/10" />
                <WLabel text="모델명 *" /><WInput placeholder="모델명 입력" />
                <WQty />
                <WBtn label="견적 요청하기" primary />
              </div>
            </Phone>
          );
        }
        function Screen3() { return <Phone><div style={{ padding:"10px" }}><div style={{ background:"#f7f6f3", padding:"10px", borderRadius:10, fontSize:9.5 }}>[매입] 아이폰 15 Pro 견적 요청 도착!</div></div></Phone>; }
        function Screen4() { return <Phone><div style={{ padding:"10px" }}><WLabel text="가견적 입력" /><div style={{ border:"2px solid #1a1917", padding:"6px", textAlign:"center", fontSize:16, fontWeight:700 }}>1,080,000</div><WBtn label="전송" primary /></div></Phone>; }
        function Screen5() { return <Phone><div style={{ padding:"10px" }}><div style={{ fontSize:8, color:"#1d3fac" }}>🟢 견적 수신 중 (7/10)</div><WDivider /><WBtn label="그만 받기" /></div></Phone>; }
        function Screen6() { return <Phone><div style={{ padding:"10px" }}><div style={{ border:"1px solid #e8e6e0", padding:"8px", borderRadius:8 }}><div style={{ fontWeight:700 }}>아르셀</div><div style={{ fontSize:14, fontWeight:700 }}>2,700,000원</div><WBtn label="채팅" /></div></div></Phone>; }
        function ScreenTBD({ label }) { return <Phone><div style={{ display:"flex", alignItems:"center", justifyContent:"center", minHeight:150, fontSize:10 }}>🚧 {label} 미정</div></Phone>; }
        function Screen10() { return <Phone><div style={{ padding:"20px", textAlign:"center" }}><WBtn label="후기 남기기" primary /></div></Phone>; }

        // ── 탭 컴포넌트 (데이터 100% 복구) ──
        function TabHistory() {
          const docs = [
            { label:"상위기획 Phase 1", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5358977500/Phase+1" },
            { label:"Specdoc — 견적 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5387878717/Specdoc" },
            { label:"Specdoc — 판매자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357764617/Specdoc" },
            { label:"Specdoc — 업자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357600795/Specdoc" },
            { label:"Specdoc — 상담 채팅", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357568021/Specdoc" },
            { label:"Specdoc — 플랫폼 어드민", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357240332/Specdoc" },
          ];
          const sessions = [
            { date:"04.24", title:"번개톡 활용 방식 결정", items:[{text:"매입 거래 전용 소통 채널 필요성 합의",s:"done"},{text:"기존 번개톡 → 매입관 전용 채팅방 신규 구축으로 확정",s:"done"},{text:"상세 스펙 정리 필요",s:"pending"}]},
            { date:"04.21", title:"상세 기획 3차", items:[{text:"포인트 시스템: 광고 포인트 활용 확정",s:"done"},{text:"정보 공유 방식: 전용 버튼 카드 방식 확정",s:"done"}]},
            { date:"04.14", title:"상세 기획 1차", items:[{text:"슬롯 유효 시간: 72시간 확정",s:"done"},{text:"과금 트리거: 견적 제출 500원 확정",s:"done"}]},
          ];
          return (
            <div>
              <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", marginBottom:20 }}>
                <div style={{ padding:"8px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontSize:10, fontWeight:700 }}>기획서 링크 — Confluence</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#fff" }}>
                  {docs.map((d, i) => (
                    <a key={i} href={d.url} target="_blank" style={{ padding:"10px 14px", borderBottom:"1px solid #f0ede6", borderRight:"1px solid #f0ede6", color:"#1d3fac", fontSize:11 }}>↗ {d.label}</a>
                  ))}
                </div>
              </div>
              {sessions.map((s, i) => (
                <div key={i} style={{ marginBottom:12, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff" }}>
                  <div style={{ padding:"9px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontWeight:600 }}>{s.date} {s.title}</div>
                  {s.items.map((item, ii) => (
                    <div key={ii} style={{ padding:"8px 14px", display:"flex", gap:10 }}><Status v={item.s} /> <span style={{ fontSize:13 }}>{item.text}</span></div>
                  ))}
                </div>
              ))}
            </div>
          );
        }

        function TabScope() {
          const decisions = [
            { n:"01", title:"서비스 방식", badge:"견적형", points:["판매자 매물 정보 입력 → 입점 업자 전원 알림 발송","슬롯: 요청당 최대 10개, 72시간 유효 (선착순)","견적 도착 즉시 판매자 화면 노출"] },
            { n:"02", title:"과금 구조", badge:"2단계", points:["1차: 견적 제안 시 광고포인트 500원","2차: 상담 선택 시 카테고리별 차등 과금"] },
            { n:"03", title:"입점 방식", badge:"Closed MVP", points:["Phase 1: 플랫폼 선정 업체만 입점","사업자등록번호 보유 프로상점 회원"] },
            { n:"04", title:"결제/정산", badge:"Phase 1 미제공", points:["업자 주도 '거래 완료' 버튼으로 트래킹만"] },
          ];
          return (
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              {decisions.map((d) => (
                <div key={d.n} style={{ border:"1px solid #e8e6e0", borderRadius:6, background:"#fff" }}>
                  <div style={{ padding:"9px 12px", background:"#f7f6f3", display:"flex", justifyContent:"space-between", fontWeight:700 }}>{d.title} <Chip text={d.badge} /></div>
                  <div style={{ padding:"10px 12px" }}>{d.points.map((p, i) => <div key={i} style={{ fontSize:12, marginBottom:4 }}>• {p}</div>)}</div>
                </div>
              ))}
            </div>
          );
        }

        function TabFlow() {
          const FeeTable = () => (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:5, marginTop:8, fontSize:10 }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#f7f6f3", padding:5, fontWeight:600 }}><span>카테고리</span><span>품목</span><span>과금액</span></div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", padding:5, borderTop:"1px solid #f0ede6" }}><span>스마트폰</span><span>전 기종</span><span>10,000원</span></div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", padding:5 }}><span>명품</span><span>1000만원↑</span><span>100,000원</span></div>
            </div>
          );
          const steps = [
            { n:1, actor:S, title:"매입 홈 진입", desc:"홈 > 판매탭 진입. 카테고리 선택.", screen:<Screen1 /> },
            { n:2, actor:S, title:"견적 폼 작성", desc:"카테고리별 특화 폼 제공. 사진(최소 1장), 브랜드/모델명 등.", 
              extra: (
                <div style={{ border:"1px solid #e8e6e0", borderRadius:4, marginTop:8, fontSize:10 }}>
                  <div style={{ background:"#f7f6f3", padding:4, fontWeight:600 }}>카테고리별 입력 항목</div>
                  <div style={{ padding:4 }}>- 스마트폰: 용량, 배터리, A/S여부</div>
                  <div style={{ padding:4 }}>- 오토바이: 연식, 주행거리, 수리이력</div>
                </div>
              ), screen:<Screen2 /> },
            { n:6, actor:S, title:"견적 비교 → 상담 선택", cost:true, desc:"가견적 비교 후 채팅 시작. 과금 발생.", extra:<FeeTable />, screen:<Screen6 /> },
            { n:10, actor:S, title:"후기 작성", desc:"긍정 키워드 기반 후기 작성.", screen:<Screen10 /> }
          ];
          return (
            <div style={{ position:"relative" }}>
              <div style={{ position:"absolute", left:19, top:0, bottom:0, width:1, background:"#e8e6e0" }} />
              {steps.map((s) => (
                <div key={s.n} style={{ display:"flex", gap:12, position:"relative", zIndex:1, marginBottom:15 }}>
                  <div style={{ width:40, height:40, borderRadius:"50%", background:s.actor.bg, border:"1.5px solid "+s.actor.border, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700 }}>{s.n}</div>
                  <div style={{ flex:1, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", padding:12 }}>
                    <div style={{ fontWeight:600, marginBottom:4 }}><Actor type={s.actor} sm /> {s.title}</div>
                    <div style={{ display:"flex", gap:15 }}>
                       <div style={{ flex:1, fontSize:12 }}>{s.desc} {s.extra}</div>
                       {s.screen}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function App() {
          const [tab, setTab] = useState(0);
          const TABS = ["회의록", "MVP 스코프", "통합 플로우", "채팅 스펙"];
          return (
            <div>
              <div style={{ background:"#1a1917", color:"#fff", padding:"16px 20px 0" }}>
                <div style={{ fontSize:19, fontWeight:700, marginBottom:15 }}>매입지원 서비스 상세 기획</div>
                <div style={{ display:"flex", gap:2 }}>
                  {TABS.map((l, i) => (
                    <button key={i} onClick={() => setTab(i)} style={{ padding:"10px 15px", border:"none", borderRadius:"5px 5px 0 0", background:tab===i?"#f7f6f3":"transparent", color:tab===i?"#000":"#999", cursor:"pointer", fontSize:12 }}>{l}</button>
                  ))}
                </div>
              </div>
              <div style={{ maxWidth:980, margin:"20px auto", padding:"0 18px" }}>
                {tab === 0 && <TabHistory />}
                {tab === 1 && <TabScope />}
                {tab === 2 && <TabFlow />}
                {tab === 3 && <div style={{fontSize:13}}>채팅 스펙 데이터 (상단 내용과 동일)</div>}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
