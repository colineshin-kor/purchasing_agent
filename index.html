<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNJANG - EXPERT BUY-BACK SUPPORT</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #f7f6f3; }
        * { box-sizing: border-box; }
        /* 스크롤바 스타일링 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 상수 및 유틸리티 컴포넌트 ---
        const S = { label: "판매자", bg: "#edf7f1", color: "#15653a", border: "#a3d9b8" };
        const B = { label: "업자",   bg: "#eff3ff", color: "#1d3fac", border: "#a5b8f5" };
        const P = { label: "시스템", bg: "#f3f4f6", color: "#374151", border: "#c9cdd6" };
        const C = { label: "과금",   bg: "#fff8ec", color: "#8a4e00", border: "#f5d09a" };
        const T = { label: "미정",   bg: "#fef9c3", color: "#713f12", border: "#fde047" };
        const PW = 200;

        function Actor({ type, sm }) {
          return <span style={{ display:"inline-flex", alignItems:"center", padding:sm?"2px 7px":"3px 9px", fontSize:sm?10:11, fontWeight:600, letterSpacing:".02em", borderRadius:3, background:type.bg, color:type.color, border:"1px solid "+type.border, whiteSpace:"nowrap", lineHeight:1.5 }}>{type.label}</span>;
        }
        function Chip({ text, color, bg, border }) {
          return <span style={{ display:"inline-block", padding:"2px 7px", fontSize:10, fontWeight:700, letterSpacing:".04em", textTransform:"uppercase", borderRadius:2, background:bg||"#f3f4f6", color:color||"#374151", border:"1px solid "+(border||"#c9cdd6") }}>{text}</span>;
        }
        function Status({ v }) {
          const m = { done:{t:"확정",bg:"#f0fdf4",c:"#166534",b:"#a7f3d0"}, pending:{t:"PENDING",bg:"#fff1f1",c:"#b91c1c",b:"#fca5a5"}, deciding:{t:"TBD",bg:"#fffbeb",c:"#92400e",b:"#fde68a"} }[v]||{t:v,bg:"#f3f4f6",c:"#374151",b:"#c9cdd6"};
          return <Chip text={m.t} color={m.c} bg={m.bg} border={m.b} />;
        }
        function Sec({ title }) { return <div style={{ fontSize:10, fontWeight:700, color:"#6b6860", letterSpacing:".06em", marginBottom:10 }}>{title}</div>; }

        // --- 와이어프레임 기본 컴포넌트 ---
        function Phone({ children, bare }) {
          return (
            <div style={{ width:PW, flexShrink:0, background:"#fff", border:"2px solid #1a1917", borderRadius:22, overflow:"hidden", boxShadow:"4px 4px 0 #c9cdd6", alignSelf:"flex-start" }}>
              <div style={{ background:"#1a1917", padding:"7px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>9:41</span>
                <span style={{ fontSize:7, color:"#aaa", letterSpacing:1 }}>▲▲ ◈ ■</span>
              </div>
              {children}
              <div style={{ height:16, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <div style={{ width:40, height:4, background:"#e8e6e0", borderRadius:2 }} />
              </div>
            </div>
          );
        }
        function PhoneTabs({ tabs, active, onSelect }) {
          return (
            <div style={{ display:"flex", borderBottom:"1px solid #e8e6e0", marginBottom:8 }}>
              {tabs.map(t => <div key={t} onClick={() => onSelect(t)} style={{ flex:1, textAlign:"center", padding:"6px 0", fontSize:9, fontWeight:active===t?700:400, color:active===t?"#1a1917":"#9b9890", borderBottom:active===t?"2px solid #1a1917":"2px solid transparent", cursor:"pointer" }}>{t}</div>)}
            </div>
          );
        }
        function WRect({ h=16, label, dashed=false, fill="#f7f6f3", color="#9b9890", mb=6, radius=4 }) {
          return <div style={{ height:h, background:fill, border:"1px "+(dashed?"dashed":"solid")+" #d5d2cb", borderRadius:radius, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:mb }}>{label && <span style={{ fontSize:8.5, color, fontWeight:500, textAlign:"center", lineHeight:1.3, padding:"0 5px" }}>{label}</span>}</div>;
        }
        function WRow({ children, gap=5, mb=6 }) { return <div style={{ display:"flex", gap, marginBottom:mb }}>{children}</div>; }
        function WBtn({ label, primary=false, flex=1, disabled=false, red=false }) {
          const bg = disabled?"#f0ede6" : red?"#e53935" : primary?"#1a1917":"#f7f6f3";
          const bc = disabled?"#d5d2cb" : red?"#e53935" : primary?"#1a1917":"#d5d2cb";
          const tc = disabled?"#c9cdd6" : (primary||red)?"#fff":"#374151";
          return <div style={{ flex, height:26, background:bg, border:"1px solid "+bc, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", cursor:disabled?"default":"pointer" }}><span style={{ fontSize:9, color:tc, fontWeight:700 }}>{label}</span></div>;
        }
        function WLabel({ text }) { return <div style={{ fontSize:9, color:"#9b9890", marginBottom:4 }}>{text}</div>; }
        function WDivider({ my=6 }) { return <div style={{ borderTop:"1px solid #f0ede6", margin:`${my}px 0` }} />; }
        function WInput({ placeholder }) {
          return <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6 }}><span style={{ fontSize:8.5, color:"#c9cdd6" }}>{placeholder}</span></div>;
        }
        function WChips({ options, selected, onSelect }) {
          return (
            <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginBottom:6 }}>
              {options.map(o => (
                <div key={o} onClick={() => onSelect(o)} style={{ padding:"4px 8px", border:"1.5px solid "+(selected===o?"#1a1917":"#d5d2cb"), borderRadius:4, cursor:"pointer", background:selected===o?"#fff":"#fff" }}>
                  <span style={{ fontSize:8.5, fontWeight:selected===o?700:400, color:selected===o?"#1a1917":"#374151" }}>{o}</span>
                </div>
              ))}
            </div>
          );
        }
        function WCheck({ text, checked }) {
          return (
            <div style={{ display:"flex", alignItems:"center", gap:5, marginBottom:6 }}>
              <div style={{ width:11, height:11, border:"1.5px solid "+(checked?"#1a1917":"#c9cdd6"), borderRadius:2, background:checked?"#1a1917":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
                {checked && <span style={{ fontSize:7, color:"#fff" }}>✓</span>}
              </div>
              <span style={{ fontSize:8.5, color:"#374151" }}>{text}</span>
            </div>
          );
        }
        function WTextarea({ placeholder, rows=3 }) {
          return (
            <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:3, minHeight:rows*16 }}>
              <span style={{ fontSize:8, color:"#c9cdd6", lineHeight:1.5 }}>{placeholder}</span>
            </div>
          );
        }
        function WQty() {
          return (
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ fontSize:9, fontWeight:600, color:"#1a1917" }}>수량</span>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9, color:"#374151" }}>−</span></div>
                <span style={{ fontSize:9, fontWeight:600 }}>1개</span>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9, color:"#374151" }}>+</span></div>
              </div>
            </div>
          );
        }

        function BottomBar({ active }) {
          const tabs = [
            { icon:"←", label:"" },
            { icon:"+", label:"견적신청", key:"quote" },
            { icon:"≡", label:"내 요청서", key:"list" },
            { icon:"♡", label:"서비스 소개", key:"info" },
          ];
          return (
            <div style={{ borderTop:"1px solid #e8e6e0", padding:"5px 4px 2px", display:"flex", gap:0, background:"#fff" }}>
              {tabs.map((t,i) => (
                <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:1 }}>
                  <div style={{ width:i===1?22:16, height:i===1?22:16, borderRadius:i===1?"50%":"3px", background:i===1?"#1a1917":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <span style={{ fontSize:i===1?11:10, color:i===1?"#fff":active===t.key?"#1a1917":"#c9cdd6", fontWeight:700 }}>{t.icon}</span>
                  </div>
                  {t.label && <span style={{ fontSize:6.5, color:active===t.key?"#1a1917":"#c9cdd6", fontWeight:active===t.key?700:400 }}>{t.label}</span>}
                </div>
              ))}
            </div>
          );
        }

        // --- 화면 정의 (Screen 1 ~ 10) ---
        function Screen1() {
          return (
            <Phone>
              <div style={{ padding:"8px 12px 0" }}>
                <span style={{ fontSize:14, color:"#374151" }}>‹</span>
              </div>
              <div style={{ padding:"6px 12px 10px" }}>
                <div style={{ fontSize:14, fontWeight:800, color:"#1a1917", lineHeight:1.35, marginBottom:4 }}>더 쉬운 거래,<br/>매입 판매로 해결해요</div>
                <div style={{ fontSize:8.5, color:"#9b9890", marginBottom:10 }}>여러 견적을 제안받고 즉시 판매할 수 있어요.</div>
                <div style={{ height:52, background:"#f0ede6", borderRadius:8, marginBottom:12 }} />
                <div style={{ fontSize:10, fontWeight:700, color:"#1a1917", marginBottom:8 }}>견적 신청하기</div>
                <div style={{ display:"flex", gap:5 }}>
                  {[["👜","명품"],["📱","스마트폰"],["💻","디지털기기"],["🏍","오토바이"]].map(([e,l]) => (
                    <div key={l} style={{ flex:1, height:46, background:"#f7f6f3", border:"1px solid #e8e6e0", borderRadius:10, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2 }}>
                      <span style={{ fontSize:14 }}>{e}</span>
                      <span style={{ fontSize:7, color:"#374151", fontWeight:600, textAlign:"center", lineHeight:1.2 }}>{l}</span>
                    </div>
                  ))}
                </div>
              </div>
              <BottomBar active="quote" />
            </Phone>
          );
        }

        function ScreenMyList() {
          const [tab, setTab] = useState("진행 중");
          return (
            <Phone>
              <div style={{ padding:"8px 12px 0" }}>
                <span style={{ fontSize:14, color:"#374151" }}>‹</span>
                <div style={{ fontSize:14, fontWeight:800, color:"#1a1917", margin:"4px 0 10px" }}>내 요청서</div>
                <div style={{ display:"flex", gap:6, marginBottom:10 }}>
                  {["진행 중","거래 체결","기간 만료"].map(t => (
                    <div key={t} onClick={() => setTab(t)} style={{ padding:"4px 10px", fontSize:9, fontWeight:tab===t?700:400, color:tab===t?"#1a1917":"#9b9890", background:tab===t?"#e8e6e0":"transparent", borderRadius:14, cursor:"pointer" }}>{t}</div>
                  ))}
                </div>
                {tab === "진행 중" && (
                  <div style={{ border:"1px solid #e8e6e0", borderRadius:10, padding:"8px 10px", display:"flex", alignItems:"center", gap:8 }}>
                    <div style={{ width:36, height:36, background:"#e8e6e0", borderRadius:6, overflow:"hidden", flexShrink:0 }}>
                      <div style={{ width:"100%", height:"100%", background:"linear-gradient(135deg,#d5d2cb,#f0ede6)" }} />
                    </div>
                    <div>
                      <div style={{ display:"flex", alignItems:"center", gap:4, marginBottom:3 }}>
                        <div style={{ width:6, height:6, borderRadius:"50%", background:"#00c49a" }} />
                        <span style={{ fontSize:8, color:"#00c49a", fontWeight:700 }}>1차 견적이 도착했어요</span>
                      </div>
                      <div style={{ fontSize:9.5, fontWeight:600, color:"#1a1917" }}>발렌시아가 르카골 솔더백 블랙 스몰</div>
                    </div>
                  </div>
                )}
                {tab !== "진행 중" && (
                  <div style={{ textAlign:"center", padding:"40px 0", color:"#c9cdd6", fontSize:9 }}>내역이 없어요</div>
                )}
              </div>
              <BottomBar active="list" />
            </Phone>
          );
        }

        function Screen2() {
          const [cat, setCat] = useState("명품");
          const [luxury, setLuxury] = useState(null);
          const [asType, setAsType] = useState(null);
          const [repair, setRepair] = useState(null);
          const [cap, setCap] = useState(null);
          const [phase, setPhase] = useState("form");

          if (phase === "list") return <ScreenMyList />;

          if (phase === "done") {
            return (
              <Phone>
                <div style={{ padding:"10px 12px", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:230 }}>
                  <div style={{ width:44, height:44, borderRadius:"50%", background:"#00c49a", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:12 }}>
                    <span style={{ fontSize:22, color:"#fff" }}>✓</span>
                  </div>
                  <div style={{ fontSize:13, fontWeight:700, color:"#1a1917", textAlign:"center", lineHeight:1.4, marginBottom:6 }}>전문가에게<br/>견적 요청이 전달되었어요</div>
                  <div style={{ fontSize:8.5, color:"#9b9890", textAlign:"center", lineHeight:1.6, marginBottom:20 }}>견적이 도착하면 번개톡으로 알려드릴게요.<br/>최대 24시간이 소요될 수 있어요.</div>
                  <div onClick={() => setPhase("list")} style={{ width:"100%", height:28, background:"#e53935", borderRadius:6, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}>
                    <span style={{ fontSize:10, color:"#fff", fontWeight:700 }}>견적 확인하기</span>
                  </div>
                </div>
              </Phone>
            );
          }

          const catTitle = { 명품:"명품", 스마트폰:"스마트폰", 디지털기기:"디지털 기기", 오토바이:"오토바이" }[cat];

          return (
            <Phone>
              <div style={{ padding:"7px 12px 10px", overflowY:"auto", maxHeight:300 }}>
                <span style={{ fontSize:12, color:"#374151" }}>‹</span>
                <div style={{ fontSize:11, fontWeight:700, color:"#1a1917", lineHeight:1.4, margin:"4px 0 8px" }}>
                  견적 받고 싶은<br/>{catTitle}에 대해 알려주세요
                </div>
                <WLabel text="사진 * 최소 1장 이상의 사진을 등록해 주세요." />
                <div style={{ width:36, height:36, background:"#f7f6f3", border:"1px solid #d5d2cb", borderRadius:6, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", marginBottom:8 }}>
                  <span style={{ fontSize:12, color:"#c9cdd6" }}>◎</span>
                  <span style={{ fontSize:6.5, color:"#c9cdd6" }}>0/10</span>
                </div>

                {cat !== "스마트폰" && (
                  <>
                    <WLabel text="브랜드와 모델명 *" />
                    <WInput placeholder="브랜드와 모델명을 입력해 주세요" />
                  </>
                )}

                {cat === "스마트폰" && (
                  <>
                    <WLabel text="브랜드 *" />
                    <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6, display:"flex", justifyContent:"space-between" }}>
                      <span style={{ fontSize:8.5, color:"#c9cdd6" }}>브랜드를 선택해 주세요</span>
                      <span style={{ fontSize:9, color:"#9b9890" }}>∨</span>
                    </div>
                    <WLabel text="모델명 *" />
                    <WInput placeholder="모델명을 입력해 주세요" />
                    <WLabel text="용량 *" />
                    <WRow gap={3} mb={6}>
                      {["64GB","128GB","256GB"].map(v => (
                        <div key={v} onClick={() => setCap(v)} style={{ flex:1, padding:"4px 0", textAlign:"center", fontSize:8, fontWeight:cap===v?700:400, color:cap===v?"#1a1917":"#374151", border:"1.5px solid "+(cap===v?"#1a1917":"#d5d2cb"), borderRadius:4, cursor:"pointer" }}>{v}</div>
                      ))}
                    </WRow>
                    <WLabel text="A/S 여부 *" />
                    <WRow gap={4} mb={3}>
                      {["공식 A/S","사설 수리"].map(v => (
                        <div key={v} onClick={() => setAsType(v)} style={{ flex:1, padding:"4px 0", textAlign:"center", fontSize:8.5, fontWeight:asType===v?700:400, border:"1.5px solid "+(asType===v?"#1a1917":"#d5d2cb"), borderRadius:4, cursor:"pointer" }}>{v}</div>
                      ))}
                    </WRow>
                  </>
                )}
                <WQty />
                <div onClick={() => setPhase("done")} style={{ height:26, background:"#fca5a5", borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", marginTop:4 }}>
                  <span style={{ fontSize:9.5, color:"#fff", fontWeight:700 }}>견적 요청하기</span>
                </div>
              </div>
            </Phone>
          );
        }

        function Screen3() {
          return (
            <Phone>
              <div style={{ padding:"10px 10px" }}>
                <div style={{ background:"#f7f6f3", border:"1px solid #e8e6e0", borderRadius:10, padding:"10px 12px" }}>
                  <div style={{ fontSize:10, fontWeight:700, color:"#1a1917", marginBottom:4 }}>번개장터</div>
                  <div style={{ fontSize:9.5, color:"#374151", lineHeight:1.6 }}>[매입] 📱 스마트폰 아이폰 15 Pro 견적 요청이 도착했습니다!</div>
                </div>
              </div>
            </Phone>
          );
        }

        function Screen4() {
          return (
            <Phone>
              <div style={{ padding:"8px 12px 10px" }}>
                <span style={{ fontSize:12, color:"#374151" }}>‹</span>
                <div style={{ fontSize:10, fontWeight:700, color:"#1a1917", margin:"4px 0 8px" }}>가견적 입력</div>
                <div style={{ background:"#f0fdf4", border:"1px solid #a3d9b8", borderRadius:8, padding:"8px 10px", marginBottom:10 }}>
                  <div style={{ fontSize:9, fontWeight:700, color:"#15653a", marginBottom:3 }}>📱 아이폰 15 Pro 256GB</div>
                  <div style={{ fontSize:8.5, color:"#374151" }}>배터리 88% · A/S 없음</div>
                </div>
                <WLabel text="매입 희망가 (가견적) *" />
                <div style={{ border:"2px solid #1a1917", borderRadius:5, padding:"6px 10px", marginBottom:4, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                  <span style={{ fontSize:16, fontWeight:700, color:"#1a1917" }}>1,080,000</span>
                  <span style={{ fontSize:9, color:"#9b9890" }}>원</span>
                </div>
                <WBtn label="견적 보내기" primary />
              </div>
            </Phone>
          );
        }

        function Screen5() {
          const [stopped, setStopped] = useState(false);
          return (
            <Phone>
              <div style={{ padding:"8px 12px 10px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
                  <span style={{ fontSize:12, color:"#374151" }}>‹</span>
                  <span style={{ fontSize:9, color:"#374151" }}>견적 취소</span>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6 }}>
                  <div style={{ width:28, height:28, background:"#f7f6f3", border:"1px solid #e8e6e0", borderRadius:4, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:13 }}>👜</span></div>
                  <span style={{ fontSize:9, fontWeight:600, color:"#1a1917" }}>발렌시아가 르카골 솔더백</span>
                </div>
                <div style={{ fontSize:8, color:stopped?"#b91c1c":"#1d3fac", fontWeight:600, marginBottom:8 }}>
                  {stopped ? "견적 수신이 중단되었어요" : "🟢 견적 수신 중 · 남은 슬롯 7/10"}
                </div>
                <div onClick={() => setStopped(true)} style={{ border:"1px solid #d5d2cb", borderRadius:5, padding:"6px", textAlign:"center", cursor:"pointer", background:"#fafafa" }}>
                  <span style={{ fontSize:9, color:"#374151", fontWeight:600 }}>견적 그만 받기</span>
                </div>
              </div>
            </Phone>
          );
        }

        function Screen6() {
          const [tab, setTab] = useState("받은 견적 1");
          return (
            <Phone>
              <div style={{ padding:"8px 12px 10px" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                  <span style={{ fontSize:12, color:"#374151" }}>‹</span>
                </div>
                <PhoneTabs tabs={["받은 견적 1","대화 내역"]} active={tab} onSelect={setTab} />
                <div style={{ border:"1px solid #e8e6e0", borderRadius:8, padding:"7px 9px", marginBottom:6 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:3 }}>
                    <span style={{ fontSize:10, fontWeight:700, color:"#1a1917" }}>아르셀</span>
                    <span style={{ fontSize:8, color:"#9b9890" }}>★3 · 거래 302건 ›</span>

        function ScreenTBD({ label }) {

            </Phone>
          );

        function Screen10() {

            <Phone>
              <div style={{ padding:"10px 12px" }}>

                </div>
                <WBtn label="후기 남기기" primary />
              </div>
            </Phone>
          );
        }

        // --- 탭별 섹션 컴포넌트 ---
        function FeeTable() {
          const rows = [
            { cat:"오토바이", sub:"전 기종", fee:"50,000원" },
            { cat:"스마트폰", sub:"전 기종", fee:"10,000원" },
            { cat:"디지털기기", sub:"태블릿, 노트북 등", fee:"10,000원" },
            { cat:"명품", sub:"견적 1,000만원 이상", fee:"100,000원" },
          ];
          return (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden", fontSize:11, marginTop:8 }}>
              {rows.map((r,i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", borderBottom:"1px solid #f0ede6", background:"#fff" }}>
                  <div style={{ padding:"5px 8px", fontSize:11, fontWeight:"600" }}>{r.cat}</div>
                  <div style={{ padding:"5px 8px", fontSize:11 }}>{r.sub}</div>
                  <div style={{ padding:"5px 8px", fontSize:11, fontWeight:700 }}>{r.fee}</div>

            { date:"04.21", title:"상세기획 3차", items:[{text:"포인트 시스템: 광고 포인트 활용 확정",s:"done"},{text:"정보 공유 방식: 전용 버튼 카드 방식 확정",s:"done"}]},
            { date:"04.15", title:"상세기획 2차 + 운영정책", items:[{text:"입점 허들: 사후 통제 중심으로 확정",s:"done"},{text:"이용약관: 법무 검토 필요",s:"pending"}]},
          ];
          return (
            <div>
              {sessions.map((s,si) => (
                <div key={si} style={{ marginBottom:12, border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden" }}>

                    <span style={{ fontSize:11, fontWeight:700, color:"#6b6860" }}>{s.date}</span>
                    <span style={{ fontSize:13, fontWeight:600 }}>{s.title}</span>
                  </div>
                  {s.items.map((item,ii) => (
                    <div key={ii} style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"8px 14px", borderBottom:"1px solid #f0ede6", background:"#fff" }}>
                      <Status v={item.s} /><span style={{ fontSize:13 }}>{item.text}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>

        function TabScope() {

          ];
          return (
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              {decisions.map((d) => (
                <div key={d.n} style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                    <span style={{ fontSize:13, fontWeight:600 }}>{d.title}</span>
                    <span style={{ marginLeft:"auto" }}><Chip text={d.badge} /></span>
                  </div>
                  <div style={{ padding:"10px 12px" }}>
                    {d.points.map((p,pi) => <div key={pi} style={{ fontSize:12, marginBottom:4 }}>- {p}</div>)}
                  </div>
                </div>

            </div>

        function TabFlow() {
          const steps = [
            { n:1, actor:S, title:"매입 홈 진입", desc:"홈 > 판매탭 진입. 카테고리 선택.", screen:<Screen1 /> },

            { n:3, actor:P, title:"업자 알림 발송", desc:"해당 카테고리 업자 전원 푸시.", screen:<Screen3 /> },

            <div style={{ position:"relative" }}>
              <div style={{ position:"absolute", left:19, top:0, bottom:0, width:1, background:"#e8e6e0" }} />
              {steps.map((s) => (
                <div key={s.n} style={{ display:"flex", gap:12, position:"relative", zIndex:1, marginBottom:10 }}>
                  <div style={{ width:40, height:40, borderRadius:"50%", flexShrink:0, marginTop:6, display:"flex", alignItems:"center", justifyContent:"center", background:s.actor.bg, border:"1.5px solid "+s.actor.border, fontSize:11, fontWeight:700, color:s.actor.color }}>{s.n}</div>
                  <div style={{ flex:1, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", overflow:"hidden" }}>
                    <div style={{ padding:"9px 14px", borderBottom:"1px solid #f0ede6", display:"flex", alignItems:"center", gap:8 }}>
                      <Actor type={s.actor} sm />
                      <span style={{ fontSize:13, fontWeight:600 }}>{s.title}</span>
                    </div>
                    <div style={{ padding:"12px 14px", display:"flex", gap:16, alignItems:"flex-start" }}>
                      <div style={{ flex:1, fontSize:12, lineHeight:1.7 }}>{s.desc}</div>
                      {s.screen}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function TabChat() {
          const customs = [
            { n:"1", title:"매입 뱃지 부착", detail:"목록 및 상단에 '매입' 표시", who:"양측" },
            { n:"2", title:"매입 전용 상단 카드", detail:"매물 요약 카드 고정", who:"양측" },
            { n:"3", title:"정보 공유 버튼", detail:"연락처/주소 전송 퀵메뉴", who:"양측" },
            { n:"4", title:"거래 완료 버튼", detail:"최종가 입력 및 확정", who:"업자만" },

          return (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden" }}>
              {customs.map((c,i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"28px 1fr 2fr 60px", gap:12, padding:"9px 14px", borderBottom:"1px solid #f0ede6", background:"#fff" }}>
                  <span style={{ fontSize:11, fontWeight:700 }}>{c.n}</span>
                  <span style={{ fontSize:12, fontWeight:600 }}>{c.title}</span>
                  <span style={{ fontSize:12 }}>{c.detail}</span>
                  <Chip text={c.who} />
                </div>
              ))}
            </div>
          );

        const TABS = [

          { label:"통합 플로우", sub:"판매자·업자·시스템" },
          { label:"채팅 스펙", sub:"번개톡 커스텀" },
        ];

        function App() {
          const [tab, setTab] = useState(2); // 기본을 통합 플로우로 설정

          return (
            <div style={{ fontFamily:"'Pretendard Variable', sans-serif", minHeight:"100vh" }}>
              <div style={{ background:"#1a1917", color:"#f5f4f0", padding:"16px 20px 0" }}>

                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <Chip text="MVP" color="#f5f4f0" bg="#2d2c29" border="#4a4945" />

                <div style={{ display:"flex", gap:2 }}>
                  {TABS.map((t,i) => (

                      <span>{t.label}</span>
                      <span style={{ fontSize:9, fontWeight:400, color:"#6b6860" }}>{t.sub}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div style={{ padding:18, maxWidth:980, margin:"0 auto" }}>
                {tab===0 && <TabHistory />}
                {tab===1 && <TabScope />}
                {tab===2 && <TabFlow />}
                {tab===3 && <TabChat />}
              </div>
            </div>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
