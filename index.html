<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNJANG - BUY-BACK PROJECT (FULL RECOVERY)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #f7f6f3; font-family: 'Pretendard Variable', -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        a { text-decoration: none; color: inherit; }
        button { font-family: inherit; border: none; cursor: pointer; }
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root">화면을 불러오는 중입니다. 잠시만 기다려 주세요...</div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── 1. 상수 정의 ─────────────────────────────────────────────────────────────
        const S = { label: "판매자", bg: "#edf7f1", color: "#15653a", border: "#a3d9b8" };
        const B = { label: "업자",   bg: "#eff3ff", color: "#1d3fac", border: "#a5b8f5" };
        const P = { label: "시스템", bg: "#f3f4f6", color: "#374151", border: "#c9cdd6" };
        const C = { label: "과금",   bg: "#fff8ec", color: "#8a4e00", border: "#f5d09a" };
        const T = { label: "미정",   bg: "#fef9c3", color: "#713f12", border: "#fde047" };
        const PW = 200;

        // ── 2. 원본 UI Primitives (와이어프레임 조각들) ───────────────────────────────
        function Actor({ type, sm }) {
          return <span style={{ display:"inline-flex", alignItems:"center", padding:sm?"2px 7px":"3px 9px", fontSize:sm?10:11, fontWeight:600, letterSpacing:".02em", borderRadius:3, background:type.bg, color:type.color, border:"1px solid "+type.border, whiteSpace:"nowrap", lineHeight:1.5 }}>{type.label}</span>;
        }
        function Chip({ text, color, bg, border }) {
          return <span style={{ display:"inline-block", padding:"2px 7px", fontSize:10, fontWeight:700, letterSpacing:".04em", textTransform:"uppercase", borderRadius:2, background:bg||"#f3f4f6", color:color||"#374151", border:"1px solid "+(border||"#c9cdd6") }}>{text}</span>;
        }
        function Status({ v }) {
          const m = { done:{t:"확정",bg:"#f0fdf4",c:"#166534",b:"#a7f3d0"}, pending:{t:"PENDING",bg:"#fff1f1",c:"#b91c1c",b:"#fca5a5"}, deciding:{t:"TBD",bg:"#fffbeb",c:"#92400e",b:"#fde68a"} }[v]||{t:v,bg:"#f3f4f6",c:"#374151",b:"#c9cdd6"};
          return <Chip text={m.t} color={m.c} bg={m.bg} border={m.b} />;
        }
        function Sec({ title }) { return <div style={{ fontSize:10, fontWeight:700, color:"#6b6860", letterSpacing:".06em", marginBottom:10 }}>{title}</div>; }

        function Phone({ children }) {
          return (
            <div style={{ width:PW, flexShrink:0, background:"#fff", border:"2px solid #1a1917", borderRadius:22, overflow:"hidden", boxShadow:"4px 4px 0 #c9cdd6", alignSelf:"flex-start" }}>
              <div style={{ background:"#1a1917", padding:"7px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>9:41</span>
                <span style={{ fontSize:7, color:"#aaa", letterSpacing:1 }}>▲▲ ◈ ■</span>
              </div>
              {children}
              <div style={{ height:16, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <div style={{ width:40, height:4, background:"#e8e6e0", borderRadius:2 }} />
              </div>
            </div>
          );
        }

        function WRect({ h=16, label, dashed=false, fill="#f7f6f3", color="#9b9890", mb=6, radius=4 }) {
          return <div style={{ height:h, background:fill, border:"1px "+(dashed?"dashed":"solid")+" #d5d2cb", borderRadius:radius, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:mb }}>{label && <span style={{ fontSize:8.5, color, fontWeight:500, textAlign:"center", lineHeight:1.3, padding:"0 5px" }}>{label}</span>}</div>;
        }
        function WBtn({ label, primary=false, flex=1, disabled=false, red=false }) {
          const bg = disabled?"#f0ede6" : red?"#e53935" : primary?"#1a1917":"#f7f6f3";
          const tc = disabled?"#c9cdd6" : (primary||red)?"#fff":"#374151";
          return <div style={{ flex, height:26, background:bg, border:"1px solid #d5d2cb", borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9, color:tc, fontWeight:700 }}>{label}</span></div>;
        }
        function WLabel({ text }) { return <div style={{ fontSize:9, color:"#9b9890", marginBottom:4 }}>{text}</div>; }
        function WInput({ placeholder }) {
          return <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6 }}><span style={{ fontSize:8.5, color:"#c9cdd6" }}>{placeholder}</span></div>;
        }
        function WDivider({ my=6 }) { return <div style={{ borderTop:"1px solid #f0ede6", margin:`${my}px 0` }} />; }
        function WQty() {
          return (
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ fontSize:9, fontWeight:600, color:"#1a1917" }}>수량</span>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9 }}>−</span></div>
                <span style={{ fontSize:9, fontWeight:600 }}>1개</span>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9 }}>+</span></div>
              </div>
            </div>
          );
        }
        function BottomBar({ active }) {
          return (
            <div style={{ borderTop:"1px solid #e8e6e0", padding:"5px 4px 2px", display:"flex", background:"#fff" }}>
              {["←", "+", "≡", "♡"].map((icon, i) => (
                <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:1 }}>
                   <div style={{ fontSize:10, color: i===1?"#1a1917":"#c9cdd6", fontWeight:700 }}>{icon}</div>
                </div>
              ))}
            </div>
          );
        }

        // ── 3. 상세 탭 데이터 & 컴포넌트 ───────────────────────────────────────────────
        
        // (1) 회의록 탭
        function TabHistory() {
          const docs = [
            { label:"상위기획 Phase 1", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5358977500/Phase+1" },
            { label:"Specdoc — 견적 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5387878717/Specdoc" },
            { label:"Specdoc — 판매자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357764617/Specdoc" },
            { label:"Specdoc — 업자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357600795/Specdoc" },
            { label:"Specdoc — 상담 채팅", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357568021/Specdoc" },
            { label:"Specdoc — 플랫폼 어드민", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357240332/Specdoc" },
          ];
          const sessions = [
            { date:"04.24", title:"번개톡 활용 방식 결정", items:[{text:"매입 거래 전용 소통 채널 필요성 합의",s:"done"},{text:"기존 번개톡 → 매입관 전용 채팅방 신규 구축으로 확정",s:"done"},{text:"매입관 전용 채팅방 구축으로 결정됨에 따라 상세 스펙 정리 필요",s:"pending"}]},
            { date:"04.21", title:"상세기획 3차", items:[{text:"포인트 시스템: 광고 포인트 활용 확정",s:"done"},{text:"정보 공유 방식 (연락처/주소/계좌): 전용 버튼 카드 방식 확정",s:"done"}]},
            { date:"04.14", title:"상세기획 1차", items:[{text:"업자 계정 체계: 프로상점 UID에 flag 추가",s:"done"},{text:"과금 트리거: 견적 제출 500원 확정",s:"done"}]},
          ];
          return (
            <div>
              <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", marginBottom:20 }}>
                <div style={{ padding:"8px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontSize:10, fontWeight:700 }}>기획서 링크 — Confluence</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#fff" }}>
                  {docs.map((d,i) => (
                    <a key={i} href={d.url} target="_blank" style={{ padding:"10px 14px", borderBottom:"1px solid #f0ede6", borderRight:"1px solid #f0ede6", color:"#1d3fac", fontSize:11, fontWeight:500 }}>↗ {d.label}</a>
                  ))}
                </div>
              </div>
              {sessions.map((s,si) => (
                <div key={si} style={{ marginBottom:12, border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
                  <div style={{ padding:"9px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontWeight:600 }}>{s.date} {s.title}</div>
                  {s.items.map((item,ii) => (
                    <div key={ii} style={{ padding:"8px 14px", display:"flex", gap:10, borderBottom:"1px solid #f0ede6" }}><Status v={item.s} /><span style={{ fontSize:13 }}>{item.text}</span></div>
                  ))}
                </div>
              ))}
            </div>
          );
        }

        // (2) MVP 스코프 탭
        function TabScope() {
          const decisions = [
            { n:"01", title:"서비스 방식", badge:"견적형", points:["판매자 매물 정보 입력 → 입점 업자 전원 알림 발송","슬롯: 요청당 최대 10개, 72시간 유효 (선착순)","견적 도착 즉시 판매자 화면 노출"] },
            { n:"02", title:"과금 구조", badge:"2단계", points:["1차: 견적 제안 시 광고포인트 500원 (즉시 확정)","2차: 상담 선택 시 카테고리별 차등 과금"] },
            { n:"03", title:"입점 방식", badge:"Closed MVP", points:["Phase 1: 플랫폼 선정 업체만 입점","사업자등록번호 보유 프로상점 회원"] },
            { n:"04", title:"결제/정산", badge:"Phase 1 미제공", points:["업자 주도 '거래 완료' 버튼으로 상태 트래킹만","거래 완료 시 실견적 필수 입력"] },
          ];
          return (
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              {decisions.map((d) => (
                <div key={d.n} style={{ border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", overflow:"hidden" }}>
                  <div style={{ padding:"9px 12px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", display:"flex", justifyContent:"space-between" }}><span style={{ fontWeight:700 }}>{d.n}. {d.title}</span><Chip text={d.badge} /></div>
                  <div style={{ padding:"10px 12px" }}>{d.points.map((p,pi) => <div key={pi} style={{ fontSize:12, marginBottom:4, lineHeight:1.5 }}>- {p}</div>)}</div>
                </div>
              ))}
            </div>
          );
        }

        // (3) 통합 플로우 탭
        function TabFlow() {
          const FeeTable = () => (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden", fontSize:11, marginTop:8 }}>
              <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>{["카테고리","품목","과금액"].map(h => <div key={h} style={{ padding:"5px 8px", fontSize:10, fontWeight:600 }}>{h}</div>)}</div>
              {[["오토바이","전 기종","50,000원"],["스마트폰","전 기종","10,000원"],["명품","1000만원↑","100,000원"]].map(([c,k,v],i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", borderBottom:"1px solid #f0ede6", background:"#fff" }}><div style={{ padding:"5px 8px" }}>{c}</div><div style={{ padding:"5px 8px" }}>{k}</div><div style={{ padding:"5px 8px", fontWeight:700 }}>{v}</div></div>
              ))}
            </div>
          );

          const steps = [
            { n:1, actor:S, title:"매입 홈 진입 → 카테고리 선택", desc:"홈 > 판매탭 진입. 헤더: '더 쉬운 거래, 매입 판매로 해결해요'. 배너 + 카테고리 그리드.", screen: (
              <Phone>
                <div style={{ padding:"8px 12px" }}><div style={{ fontSize:14, fontWeight:800, marginBottom:4 }}>더 쉬운 거래,<br/>매입 판매로 해결해요</div><div style={{ height:52, background:"#f0ede6", borderRadius:8, marginBottom:12 }} /><div style={{ display:"flex", gap:5 }}>{["명품","폰","디지털","오토바이"].map(l=><div key={l} style={{flex:1,height:40,background:"#f7f6f3",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7}}>{l}</div>)}</div></div><BottomBar />
              </Phone>
            )},
            { n:2, actor:S, title:"견적 폼 작성", desc:"카테고리별 특화 폼 제공. 사진(최소 1장), 브랜드/모델명, 상세정보 필수.", extra: (
              <div style={{ marginTop:8, border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden", fontSize:10 }}>
                <div style={{ background:"#f7f6f3", padding:4, fontWeight:600 }}>카테고리별 입력 항목</div>
                {["스마트폰: 용량, A/S여부","오토바이: 연식, 주행거리"].map(t=><div key={t} style={{padding:4,background:"#fff"}}>- {t}</div>)}
              </div>
            ), notes:["사진: 최소 1장, 최대 10장.","유효성 체크: 필수값 미입력 시 요청 불가."], screen: (
              <Phone><div style={{ padding:"10px 12px" }}><WLabel text="사진 *" /><WRect h={36} label="◎ 0/10" /><WLabel text="모델명 *" /><WInput placeholder="모델명 입력" /><WQty /><WBtn label="견적 요청하기" primary /></div></Phone>
            )},
            { n:6, actor:S, title:"견적 비교 → 상담 선택", cost:true, desc:"가견적가 비교 후 채팅 문의 시작. 과금 발생.", extra: <FeeTable />, screen: (
              <Phone><div style={{ padding:"10px" }}><div style={{ fontSize:11, fontWeight:700, marginBottom:8 }}>견적 비교</div><div style={{ border:"1px solid #e8e6e0", borderRadius:8, padding:"8px" }}><div style={{ fontWeight:700 }}>아르셀</div><div style={{ fontSize:14, fontWeight:700 }}>2,700,000원</div><WBtn label="채팅 문의" /></div></div></Phone>
            )},
            { n:10, actor:S, title:"후기 작성", desc:"긍정 키워드 기반 후기 작성. 프로필 신뢰 지표에 반영.", screen: (
              <Phone><div style={{ padding:"20px", textAlign:"center" }}><WBtn label="후기 남기기" primary /></div></Phone>
            )}
          ];

          return (
            <div style={{ position:"relative" }}>
              <div style={{ position:"absolute", left:19, top:0, bottom:0, width:1, background:"#e8e6e0" }} />
              {steps.map((s) => (
                <div key={s.n} style={{ display:"flex", gap:12, position:"relative", zIndex:1, marginBottom:20 }}>
                  <div style={{ width:40, height:40, borderRadius:"50%", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", background:s.actor.bg, border:"1.5px solid "+s.actor.border, fontWeight:700 }}>{s.n}</div>
                  <div style={{ flex:1, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", overflow:"hidden" }}>
                    <div style={{ padding:"9px 14px", borderBottom:"1px solid #f0ede6", display:"flex", alignItems:"center", gap:8 }}><Actor type={s.actor} sm /><span style={{ fontWeight:600 }}>{s.title}</span>{s.cost && <Chip text="과금" color={C.color} bg={C.bg} border={C.border} />}</div>
                    <div style={{ padding:"12px 14px", display:"flex", gap:16 }}>
                      <div style={{ flex:1 }}><p style={{ fontSize:12, lineHeight:1.7, margin:0 }}>{s.desc}</p>{s.extra}{s.notes && <div style={{marginTop:8}}>{s.notes.map((n,i)=><div key={i} style={{fontSize:11,color:"#374151"}}>▸ {n}</div>)}</div>}</div>
                      {s.screen}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          );
        }

        // (4) 채팅 스펙 탭
        function TabChat() {
          const customs = [{ n:"1", t:"매입 뱃지", d:"목록/상단 '매입' 노출" },{ n:"2", t:"상단 카드", d:"매물 요약 고정" },{ n:"3", t:"정보공유", d:"연락처/주소 카드" },{ n:"4", t:"완료버튼", d:"업자 전용. 최종가 입력" }];
          return (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
              {customs.map((c,i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"30px 1fr 2fr", padding:"10px", borderBottom:"1px solid #f0ede6" }}><span style={{fontWeight:700}}>{c.n}</span><span style={{fontWeight:600}}>{c.t}</span><span>{c.d}</span></div>
              ))}
            </div>
          );
        }

        // ── 4. 메인 앱 (App) ────────────────────────────────────────────────────────────
        function App() {
          const [tab, setTab] = useState(2); // 기본 통합 플로우
          const TABS = ["회의록", "MVP 스코프", "통합 플로우", "채팅 스펙"];
          return (
            <div>
              <div style={{ background:"#1a1917", color:"#fff", padding:"16px 20px 0" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:15 }}>
                  <div><div style={{ fontSize:10, color:"#9b9890" }}>BUNJANG BUY-BACK PHASE 1</div><div style={{ fontSize:19, fontWeight:700 }}>매입지원 서비스 기획 대시보드</div></div>
                  <Chip text="PHASE 1" color="#fff" bg="#333" />
                </div>
                <div style={{ display:"flex", gap:2 }}>
                  {TABS.map((l, i) => (
                    <button key={i} onClick={() => setTab(i)} style={{ padding:"10px 15px", borderRadius:"5px 5px 0 0", background:tab===i?"#f7f6f3":"transparent", color:tab===i?"#000":"#999", fontSize:12, fontWeight:tab===i?700:400 }}>{l}</button>
                  ))}
                </div>
              </div>
              <div style={{ maxWidth:980, margin:"20px auto", padding:"0 18px" }}>
                {tab === 0 && <TabHistory />}
                {tab === 1 && <TabScope />}
                {tab === 2 && <TabFlow />}
                {tab === 3 && <TabChat />}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
