<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNJANG - EXPERT BUY-BACK SUPPORT</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #f7f6f3; font-family: 'Pretendard Variable', -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        a { text-decoration: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 공통 상수 및 컴포넌트 ---
        const S = { label: "판매자", bg: "#edf7f1", color: "#15653a", border: "#a3d9b8" };
        const B = { label: "업자",   bg: "#eff3ff", color: "#1d3fac", border: "#a5b8f5" };
        const P = { label: "시스템", bg: "#f3f4f6", color: "#374151", border: "#c9cdd6" };
        const C = { label: "과금",   bg: "#fff8ec", color: "#8a4e00", border: "#f5d09a" };
        const T = { label: "미정",   bg: "#fef9c3", color: "#713f12", border: "#fde047" };
        const PW = 200;

        function Actor({ type, sm }) {
          return <span style={{ display:"inline-flex", alignItems:"center", padding:sm?"2px 7px":"3px 9px", fontSize:sm?10:11, fontWeight:600, letterSpacing:".02em", borderRadius:3, background:type.bg, color:type.color, border:"1px solid "+type.border, whiteSpace:"nowrap", lineHeight:1.5 }}>{type.label}</span>;
        }
        function Chip({ text, color, bg, border }) {
          return <span style={{ display:"inline-block", padding:"2px 7px", fontSize:10, fontWeight:700, letterSpacing:".04em", textTransform:"uppercase", borderRadius:2, background:bg||"#f3f4f6", color:color||"#374151", border:"1px solid "+(border||"#c9cdd6") }}>{text}</span>;
        }
        function Status({ v }) {
          const m = { done:{t:"확정",bg:"#f0fdf4",c:"#166534",b:"#a7f3d0"}, pending:{t:"PENDING",bg:"#fff1f1",c:"#b91c1c",b:"#fca5a5"}, deciding:{t:"TBD",bg:"#fffbeb",c:"#92400e",b:"#fde68a"} }[v]||{t:v,bg:"#f3f4f6",c:"#374151",b:"#c9cdd6"};
          return <Chip text={m.t} color={m.c} bg={m.bg} border={m.b} />;
        }
        function Sec({ title }) { return <div style={{ fontSize:10, fontWeight:700, color:"#6b6860", letterSpacing:".06em", marginBottom:10 }}>{title}</div>; }

        // --- Wireframe Primitives ---
        function Phone({ children }) {
          return (
            <div style={{ width:PW, flexShrink:0, background:"#fff", border:"2px solid #1a1917", borderRadius:22, overflow:"hidden", boxShadow:"4px 4px 0 #c9cdd6", alignSelf:"flex-start" }}>
              <div style={{ background:"#1a1917", padding:"7px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>9:41</span>
                <span style={{ fontSize:7, color:"#aaa", letterSpacing:1 }}>▲▲ ◈ ■</span>
              </div>
              {children}
              <div style={{ height:16, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <div style={{ width:40, height:4, background:"#e8e6e0", borderRadius:2 }} />
              </div>
            </div>
          );
        }
        function PhoneTabs({ tabs, active, onSelect }) {
          return (
            <div style={{ display:"flex", borderBottom:"1px solid #e8e6e0", marginBottom:8 }}>
              {tabs.map(t => <div key={t} onClick={() => onSelect(t)} style={{ flex:1, textAlign:"center", padding:"6px 0", fontSize:9, fontWeight:active===t?700:400, color:active===t?"#1a1917":"#9b9890", borderBottom:active===t?"2px solid #1a1917":"2px solid transparent", cursor:"pointer" }}>{t}</div>)}
            </div>
          );
        }
        function WRect({ h=16, label, dashed=false, fill="#f7f6f3", color="#9b9890", mb=6, radius=4 }) {
          return <div style={{ height:h, background:fill, border:"1px "+(dashed?"dashed":"solid")+" #d5d2cb", borderRadius:radius, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:mb }}>{label && <span style={{ fontSize:8.5, color, fontWeight:500, textAlign:"center", lineHeight:1.3, padding:"0 5px" }}>{label}</span>}</div>;
        }
        function WRow({ children, gap=5, mb=6 }) { return <div style={{ display:"flex", gap, marginBottom:mb }}>{children}</div>; }
        function WBtn({ label, primary=false, flex=1, disabled=false, red=false }) {
          const bg = disabled?"#f0ede6" : red?"#e53935" : primary?"#1a1917":"#f7f6f3";
          const bc = disabled?"#d5d2cb" : red?"#e53935" : primary?"#1a1917":"#d5d2cb";
          const tc = disabled?"#c9cdd6" : (primary||red)?"#fff":"#374151";
          return <div style={{ flex, height:26, background:bg, border:"1px solid "+bc, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", cursor:disabled?"default":"pointer" }}><span style={{ fontSize:9, color:tc, fontWeight:700 }}>{label}</span></div>;
        }
        function WLabel({ text }) { return <div style={{ fontSize:9, color:"#9b9890", marginBottom:4 }}>{text}</div>; }
        function WDivider({ my=6 }) { return <div style={{ borderTop:"1px solid #f0ede6", margin:`${my}px 0` }} />; }
        function WInput({ placeholder }) {
          return <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6 }}><span style={{ fontSize:8.5, color:"#c9cdd6" }}>{placeholder}</span></div>;
        }
        function WQty() {
          return (
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ fontSize:9, fontWeight:600, color:"#1a1917" }}>수량</span>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9, color:"#374151" }}>−</span></div>
                <span style={{ fontSize:9, fontWeight:600 }}>1개</span>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9, color:"#374151" }}>+</span></div>
              </div>
            </div>
          );
        }
        function BottomBar({ active }) {
          const tabs = [
            { icon:"←", label:"" },
            { icon:"+", label:"견적신청", key:"quote" },
            { icon:"≡", label:"내 요청서", key:"list" },
            { icon:"♡", label:"서비스 소개", key:"info" },
          ];
          return (
            <div style={{ borderTop:"1px solid #e8e6e0", padding:"5px 4px 2px", display:"flex", gap:0, background:"#fff" }}>
              {tabs.map((t,i) => (
                <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:1 }}>
                  <div style={{ width:i===1?22:16, height:i===1?22:16, borderRadius:i===1?"50%":"3px", background:i===1?"#1a1917":"transparent", display:"flex", alignItems:"center", justifyContent:"center" }}>
                    <span style={{ fontSize:i===1?11:10, color:i===1?"#fff":active===t.key?"#1a1917":"#c9cdd6", fontWeight:700 }}>{t.icon}</span>
                  </div>
                  {t.label && <span style={{ fontSize:6.5, color:active===t.key?"#1a1917":"#c9cdd6", fontWeight:active===t.key?700:400 }}>{t.label}</span>}
                </div>
              ))}
            </div>
          );
        }

        // --- Screens (원본 로직 완전 복구) ---
        function Screen1() {
          return (
            <Phone>
              <div style={{ padding:"8px 12px 0" }}>
                <span style={{ fontSize:14, color:"#374151" }}>‹</span>
              </div>
              <div style={{ padding:"6px 12px 10px" }}>
                <div style={{ fontSize:14, fontWeight:800, color:"#1a1917", lineHeight:1.35, marginBottom:4 }}>더 쉬운 거래,<br/>매입 판매로 해결해요</div>
                <div style={{ fontSize:8.5, color:"#9b9890", marginBottom:10 }}>여러 견적을 제안받고 즉시 판매할 수 있어요.</div>
                <div style={{ height:52, background:"#f0ede6", borderRadius:8, marginBottom:12 }} />
                <div style={{ fontSize:10, fontWeight:700, color:"#1a1917", marginBottom:8 }}>견적 신청하기</div>
                <div style={{ display:"flex", gap:5 }}>
                  {[["👜","명품"],["📱","스마트폰"],["💻","디지털기기"],["🏍","오토바이"]].map(([e,l]) => (
                    <div key={l} style={{ flex:1, height:46, background:"#f7f6f3", border:"1px solid #e8e6e0", borderRadius:10, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:2 }}>
                      <span style={{ fontSize:14 }}>{e}</span>
                      <span style={{ fontSize:7, color:"#374151", fontWeight:600, textAlign:"center", lineHeight:1.2 }}>{l}</span>
                    </div>
                  ))}
                </div>
              </div>
              <BottomBar active="quote" />
            </Phone>
          );
        }

        function Screen2() {
          const [cat, setCat] = useState("명품");
          const [phase, setPhase] = useState("form");
          if (phase === "done") {
             return <Phone><div style={{ padding:"40px 12px", textAlign:"center" }}><div style={{ width:44, height:44, borderRadius:"50%", background:"#00c49a", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 12px" }}><span style={{ color:"#fff" }}>✓</span></div><div style={{ fontSize:13, fontWeight:700 }}>견적 요청 완료!</div></div></Phone>;
          }
          return (
            <Phone>
              <div style={{ padding:"7px 12px 10px", overflowY:"auto", maxHeight:300 }}>
                <div style={{ fontSize:11, fontWeight:700, margin:"4px 0 8px" }}>{cat} 견적 정보 입력</div>
                <WLabel text="사진 *" /><WRect h={36} label="◎ 0/10" />
                <WLabel text="브랜드와 모델명 *" /><WInput placeholder="입력해주세요" />
                <WQty />
                <div onClick={() => setPhase("done")} style={{ height:26, background:"#fca5a5", borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer" }}><span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>견적 요청하기</span></div>
              </div>
            </Phone>
          );
        }

        function ScreenMyList() {
          return (
            <Phone>
              <div style={{ padding:"8px 12px" }}>
                <div style={{ fontSize:14, fontWeight:800, marginBottom:10 }}>내 요청서</div>
                <div style={{ border:"1px solid #e8e6e0", borderRadius:10, padding:"8px 10px", display:"flex", alignItems:"center", gap:8 }}>
                  <div style={{ width:36, height:36, background:"#e8e6e0", borderRadius:6 }} />
                  <div>
                    <div style={{ fontSize:8, color:"#00c49a", fontWeight:700 }}>1차 견적이 도착했어요</div>
                    <div style={{ fontSize:9.5, fontWeight:600 }}>발렌시아가 르카골...</div>
                  </div>
                </div>
              </div>
              <BottomBar active="list" />
            </Phone>
          );
        }

        function Screen3() { return <Phone><div style={{ padding:"10px" }}><div style={{ background:"#f7f6f3", padding:"10px", borderRadius:10 }}><div style={{ fontSize:10, fontWeight:700 }}>번개장터</div><div style={{ fontSize:9.5 }}>[매입] 아이폰 15 Pro 견적 요청 도착!</div></div></div></Phone>; }
        function Screen4() { return <Phone><div style={{ padding:"10px" }}><WLabel text="매입 희망가 *" /><div style={{ border:"2px solid #1a1917", padding:"6px", textAlign:"center", fontSize:16, fontWeight:700, borderRadius:5 }}>1,080,000원</div><div style={{ height:10 }} /><WBtn label="견적 보내기" primary /></div></Phone>; }
        function Screen5() { return <Phone><div style={{ padding:"10px" }}><div style={{ fontSize:8, color:"#1d3fac", fontWeight:600 }}>🟢 견적 수신 중 · 7/10</div><WDivider /><WBtn label="견적 그만 받기" /></div></Phone>; }
        function Screen6() { return <Phone><div style={{ padding:"10px" }}><div style={{ fontSize:11, fontWeight:700 }}>전문가 견적 비교</div><div style={{ border:"1px solid #e8e6e0", padding:"8px", borderRadius:8, marginTop:8 }}><div style={{ fontWeight:700 }}>아르셀</div><div style={{ fontSize:14, fontWeight:700 }}>2,700,000원</div><WBtn label="채팅 문의" /></div></div></Phone>; }
        function ScreenTBD({ label }) { return <Phone><div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", minHeight:210, gap:8 }}><div style={{ fontSize:24 }}>🚧</div><div style={{ fontSize:10, fontWeight:700, color:"#713f12" }}>{label} 미확정</div></div></Phone>; }
        function Screen10() { return <Phone><div style={{ padding:"15px", textAlign:"center" }}><div style={{ fontSize:11, fontWeight:700, marginBottom:10 }}>거래 후기 남기기</div><WBtn label="후기 남기기" primary /></div></Phone>; }

        // --- Tabs ---
        function TabHistory() {
          const sessions = [
            { date:"04.24", title:"번개톡 활용 방식 결정", items:[{text:"매입 거래 전용 소통 채널 필요성 합의",s:"done"},{text:"기존 번개톡 → 매입관 전용 채팅방 신규 구축으로 확정",s:"done"},{text:"매입관 전용 채팅방 구축으로 결정됨에 따라 상세 스펙 정리 필요",s:"pending"}]},
            { date:"04.21", title:"상세기획 3차", items:[{text:"포인트 시스템: 광고 포인트 활용 확정 (C-lab 이력 관리 연동)",s:"done"},{text:"정보 공유 방식 (연락처/주소/계좌): 전용 버튼 카드 방식 확정",s:"done"},{text:"채팅방 비활성화: 거래완료·취소 후 상태 처리 정책 정리 필요",s:"pending"}]},
            { date:"04.15", title:"상세기획 2차 + 운영정책", items:[{text:"입점 허들: 보증보험·계약서 제외, 사후 통제 중심으로 확정",s:"done"},{text:"이용약관: 업자 = 구매자 역할인 특수 케이스 법무 검토 필요",s:"pending"},{text:"제재 기준: '과도한 감액' 등 모호한 기준 정량화 기획 필요",s:"pending"},{text:"연락 두절: 판매자 무응답 시 귀책 제재 조항 별도 검토 예정",s:"pending"}]},
            { date:"04.14", title:"상세기획 1차", items:[{text:"업자 계정 체계: 프로상점 UID에 매입 업자 flag 추가 방식 확정",s:"done"},{text:"슬롯 유효 시간: 72시간으로 확정",s:"done"},{text:"다시 요청하기: 1회 허용, 기존 카드 유지, 기존 업체 자동 제외 확정",s:"done"},{text:"과금 트리거: 견적 제출 500원 + 상담 시작 시 차등 과금 확정",s:"done"}]},
            { date:"04.09", title:"상위기획 공유", items:[{text:"오픈 카테고리: 비상품권 4종 MVP 확정",s:"done"},{text:"서비스 방식: 견적형 (Pay-per-Lead) 확정",s:"done"},{text:"결제/정산: Phase 1 미제공, 거래완료 버튼 트래킹만",s:"done"}]},
          ];
          const pending = sessions.flatMap(x => x.items.filter(i => i.s==="pending"));
          return (
            <div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:20 }}>
                <div style={{ background:"#fff8ec", border:"1px solid #f5d09a", borderRadius:6, padding:"12px 14px" }}>
                  <div style={{ fontSize:10, fontWeight:700, color:"#8a4e00", marginBottom:8 }}>PENDING — 미결 항목 ({pending.length}건)</div>
                  {pending.map((p,i) => <div key={i} style={{ display:"flex", gap:6, marginBottom:5 }}><span style={{ color:"#b91c1c" }}>▸</span><span style={{ fontSize:12 }}>{p.text}</span></div>)}
                </div>
                <div style={{ background:"#f7f6f3", border:"1px solid #e3e0d9", borderRadius:6, padding:"12px 14px" }}>
                    <div style={{ fontSize:10, fontWeight:700, marginBottom:8 }}>PHASE 1 목표</div>
                    <div style={{ fontSize:12 }}>2026년 7월 오픈 목표</div>
                </div>
              </div>
              {sessions.map((s,si) => (
                <div key={si} style={{ marginBottom:12, border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                    <span style={{ fontSize:11, fontWeight:700, color:"#6b6860" }}>{s.date}</span>
                    <span style={{ fontSize:13, fontWeight:600 }}>{s.title}</span>
                  </div>
                  {s.items.map((item,ii) => (
                    <div key={ii} style={{ display:"flex", gap:10, padding:"8px 14px", borderBottom:"1px solid #f0ede6" }}>
                      <Status v={item.s} /><span style={{ fontSize:13 }}>{item.text}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          );
        }

        function TabScope() {
          const decisions = [
            { n:"01", title:"서비스 방식", badge:"견적형", points:["판매자 매물 정보 입력 → 입점 업자 전원 알림 발송","슬롯: 요청당 최대 10개, 72시간 유효 (선착순)","견적 도착 즉시 판매자 화면 노출","판매자는 언제든 원하는 업자에게 상담 요청 가능"] },
            { n:"02", title:"과금 구조", badge:"2단계", points:["1차: 견적 제안 시 광고포인트 500원 (즉시 확정, 환불 불가)","2차: 상담 선택 시 카테고리별 차등 과금","입점료 없음","과금 실패 시 채팅방 미생성 + 롤백"] },
            { n:"03", title:"입점 방식", badge:"Closed MVP", points:["Phase 1: 플랫폼 선정 업체만 입점","사업자등록번호 보유 프로상점 회원","사기 이력 없음 확인"] },
            { n:"04", title:"결제/정산", badge:"Phase 1 미제공", points:["계좌 송금 기능 Phase 2 설계 예정","업자 주도 '거래 완료' 버튼으로 상태 트래킹만","거래 완료 시 실견적 필수 입력"] },
            { n:"05", title:"다시 요청하기", badge:"1회 허용", points:["노출: 슬롯 소진 or 72h 만료 or 그만받기","기존 견적 카드 유지, 기존 업체 자동 제외"] },
            { n:"06", title:"신뢰 지표", badge:"소프트 평가", points:["별점 대신 긍정 키워드 뱃지 평가","거래건수/채택률/응대율 프로필 공개"] },
          ];
          return (
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10 }}>
              {decisions.map((d) => (
                <div key={d.n} style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                    <span style={{ fontSize:13, fontWeight:600 }}>{d.title}</span>
                    <span style={{ marginLeft:"auto" }}><Chip text={d.badge} /></span>
                  </div>
                  <div style={{ padding:"10px 12px" }}>
                    {d.points.map((p,pi) => <div key={pi} style={{ fontSize:12, marginBottom:4, lineHeight:1.5 }}>- {p}</div>)}
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function TabFlow() {
          const steps = [
            { n:1, actor:S, title:"매입 홈 진입 → 카테고리 선택", desc:"홈 > 판매탭 진입. 헤더: '더 쉬운 거래, 매입 판매로 해결해요'. 배너 + 카테고리 그리드.", screen:<Screen1 /> },
            { n:2, actor:S, title:"견적 폼 작성", desc:"카테고리별 특화 폼 제공. 사진(최소 1장), 브랜드/모델명, 상세정보 필수.", screen:<Screen2 /> },
            { n:3, actor:P, title:"슬롯 활성화 + 알림 발송", desc:"견적 요청 즉시 슬롯 10개 활성화, 72h 카운트다운 시작. 업자 전원 푸시.", screen:<Screen3 /> },
            { n:4, actor:B, title:"가견적 입력 → 전송", desc:"업자 홈에서 요청 확인. 가견적가 + 어필메모(100자) 입력 후 전송.", screen:<Screen4 /> },
            { n:5, actor:P, title:"견적 즉시 노출 + 판매자 푸시", desc:"도착 즉시 판매자 화면 목록에 추가. 10개 도달 시 자동 종료.", screen:<Screen5 /> },
            { n:6, actor:S, title:"견적 비교 → 상담 선택", desc:"가견적가/거래건수 비교 후 채팅 문의 시작. 과금 발생.", screen:<Screen6 /> },
            { n:7, actor:T, title:"채팅방 생성 + 안내 메시지", desc:"매입 전용 플래그 채팅방. 매물 요약 카드 상단 고정.", screen:<ScreenTBD label="채팅방" /> },
            { n:8, actor:T, title:"정보 공유 방식 (연락처 등)", desc:"개인정보 공유를 위한 시스템 카드 방식 검토 중.", screen:<ScreenTBD label="정보 공유" /> },
            { n:9, actor:T, title:"실물 검수 → 거래 완료", desc:"최종 매입가 확정 및 거래 완료 처리.", screen:<ScreenTBD label="거래 완료" /> },
            { n:10, actor:S, title:"후기 작성", desc:"별점 대신 긍정 키워드 뱃지 평가.", screen:<Screen10 /> },
          ];
          return (
            <div style={{ position:"relative" }}>
              <div style={{ position:"absolute", left:19, top:0, bottom:0, width:1, background:"#e8e6e0" }} />
              {steps.map((s) => (
                <div key={s.n} style={{ display:"flex", gap:12, position:"relative", zIndex:1, marginBottom:10 }}>
                  <div style={{ width:40, height:40, borderRadius:"50%", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", background:s.actor.bg, border:"1.5px solid "+s.actor.border, fontSize:11, fontWeight:700 }}>{s.n}</div>
                  <div style={{ flex:1, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", overflow:"hidden" }}>
                    <div style={{ padding:"9px 14px", borderBottom:"1px solid #f0ede6", display:"flex", alignItems:"center", gap:8 }}>
                      <Actor type={s.actor} sm />
                      <span style={{ fontSize:13, fontWeight:600 }}>{s.title}</span>
                    </div>
                    <div style={{ padding:"12px 14px", display:"flex", gap:16, alignItems:"flex-start" }}>
                      <div style={{ flex:1, fontSize:12, lineHeight:1.6 }}>{s.desc}</div>
                      {s.screen}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function TabChat() {
          const customs = [
            { n:"1", title:"매입 뱃지 부착", detail:"목록 및 상단에 '매입' 뱃지 노출.", who:"양측" },
            { n:"2", title:"기존 상단 카드 제거", detail:"C2C 거래 관련 UI 제거.", who:"양측" },
            { n:"3", title:"매입 전용 상단 카드", detail:"매물 요약 카드 상단 고정.", who:"양측" },
            { n:"4", title:"자동 첫 메시지", detail:"시스템 안내 메시지 자동 전송.", who:"양측" },
            { n:"5", title:"정보 공유 버튼", detail:"연락처/주소/계좌 퀵 버튼.", who:"양측" },
            { n:"6", title:"거래 완료 버튼", detail:"업자 전용 거래 확정 버튼.", who:"업자만" },
          ];
          return (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
              {customs.map((c,i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"28px 1fr 2fr 60px", gap:12, padding:"9px 14px", borderBottom:"1px solid #f0ede6" }}>
                  <span style={{ fontSize:11, fontWeight:700 }}>{c.n}</span>
                  <span style={{ fontSize:12, fontWeight:600 }}>{c.title}</span>
                  <span style={{ fontSize:12 }}>{c.detail}</span>
                  <Chip text={c.who} />
                </div>
              ))}
            </div>
          );
        }

        // --- Root ---
        const TABS = [{ label:"회의록", sub:"의사결정 히스토리" }, { label:"MVP 스코프", sub:"Phase 1 전략" }, { label:"통합 플로우", sub:"판매자·업자·시스템" }, { label:"채팅 스펙", sub:"번개톡 커스텀" }];

        function App() {
          const [tab, setTab] = useState(2);
          return (
            <div>
              <div style={{ background:"#1a1917", color:"#fff", padding:"16px 20px 0" }}>
                <div style={{ display:"flex", alignItems:"flex-end", justifyContent:"space-between", marginBottom:14 }}>
                  <div>
                    <div style={{ fontSize:10, color:"#9b9890", marginBottom:5 }}>BUNJANG BUY-BACK PROJECT</div>
                    <div style={{ fontSize:19, fontWeight:700 }}>전문업자 매입지원 서비스 기획</div>
                  </div>
                  <div style={{ display:"flex", gap:6 }}>
                    <Chip text="PHASE 1" color="#fff" bg="#2d2c29" />
                    <Chip text="7월 목표" color="#f5d09a" bg="#2d2515" />
                  </div>
                </div>
                <div style={{ display:"flex", gap:2 }}>
                  {TABS.map((t,i) => (
                    <button key={i} onClick={() => setTab(i)} style={{ padding:"9px 16px", fontSize:12, fontWeight:tab===i?600:400, color:tab===i?"#1a1917":"#9b9890", background:tab===i?"#f7f6f3":"transparent", border:"none", borderRadius:"5px 5px 0 0", cursor:"pointer" }}>
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>
              <div style={{ padding:18, maxWidth:980, margin:"0 auto" }}>
                {tab===0 && <TabHistory />}
                {tab===1 && <TabScope />}
                {tab===2 && <TabFlow />}
                {tab===3 && <TabChat />}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
