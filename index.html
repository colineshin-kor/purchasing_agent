<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNJANG - BUY-BACK PROJECT DASHBOARD</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #f7f6f3; font-family: 'Pretendard Variable', -apple-system, sans-serif; }
        * { box-sizing: border-box; }
        a { text-decoration: none; }
        button { font-family: inherit; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ── 원본 상수 ──
        const S = { label: "판매자", bg: "#edf7f1", color: "#15653a", border: "#a3d9b8" };
        const B = { label: "업자",   bg: "#eff3ff", color: "#1d3fac", border: "#a5b8f5" };
        const P = { label: "시스템", bg: "#f3f4f6", color: "#374151", border: "#c9cdd6" };
        const C = { label: "과금",   bg: "#fff8ec", color: "#8a4e00", border: "#f5d09a" };
        const T = { label: "미정",   bg: "#fef9c3", color: "#713f12", border: "#fde047" };
        const PW = 200;

        // ── 공통 UI ──
        function Actor({ type, sm }) {
          return <span style={{ display:"inline-flex", alignItems:"center", padding:sm?"2px 7px":"3px 9px", fontSize:sm?10:11, fontWeight:600, letterSpacing:".02em", borderRadius:3, background:type.bg, color:type.color, border:"1px solid "+type.border, whiteSpace:"nowrap", lineHeight:1.5 }}>{type.label}</span>;
        }
        function Chip({ text, color, bg, border }) {
          return <span style={{ display:"inline-block", padding:"2px 7px", fontSize:10, fontWeight:700, letterSpacing:".04em", textTransform:"uppercase", borderRadius:2, background:bg||"#f3f4f6", color:color||"#374151", border:"1px solid "+(border||"#c9cdd6") }}>{text}</span>;
        }
        function Status({ v }) {
          const m = { done:{t:"확정",bg:"#f0fdf4",c:"#166534",b:"#a7f3d0"}, pending:{t:"PENDING",bg:"#fff1f1",c:"#b91c1c",b:"#fca5a5"}, deciding:{t:"TBD",bg:"#fffbeb",c:"#92400e",b:"#fde68a"} }[v]||{t:v,bg:"#f3f4f6",c:"#374151",b:"#c9cdd6"};
          return <Chip text={m.t} color={m.c} bg={m.bg} border={m.b} />;
        }
        function Sec({ title }) { return <div style={{ fontSize:10, fontWeight:700, color:"#6b6860", letterSpacing:".06em", marginBottom:10 }}>{title}</div>; }

        function Phone({ children }) {
          return (
            <div style={{ width:PW, flexShrink:0, background:"#fff", border:"2px solid #1a1917", borderRadius:22, overflow:"hidden", boxShadow:"4px 4px 0 #c9cdd6", alignSelf:"flex-start" }}>
              <div style={{ background:"#1a1917", padding:"7px 16px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span style={{ fontSize:9, color:"#fff", fontWeight:700 }}>9:41</span>
                <span style={{ fontSize:7, color:"#aaa", letterSpacing:1 }}>▲▲ ◈ ■</span>
              </div>
              {children}
              <div style={{ height:16, background:"#fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <div style={{ width:40, height:4, background:"#e8e6e0", borderRadius:2 }} />
              </div>
            </div>
          );
        }

        function PhoneTabs({ tabs, active, onSelect }) {
          return (
            <div style={{ display:"flex", borderBottom:"1px solid #e8e6e0", marginBottom:8 }}>
              {tabs.map(t => <div key={t} onClick={() => onSelect(t)} style={{ flex:1, textAlign:"center", padding:"6px 0", fontSize:9, fontWeight:active===t?700:400, color:active===t?"#1a1917":"#9b9890", borderBottom:active===t?"2px solid #1a1917":"2px solid transparent", cursor:"pointer" }}>{t}</div>)}
            </div>
          );
        }
        
        function WRect({ h=16, label, dashed=false, fill="#f7f6f3", color="#9b9890", mb=6, radius=4 }) {
          return <div style={{ height:h, background:fill, border:"1px "+(dashed?"dashed":"solid")+" #d5d2cb", borderRadius:radius, display:"flex", alignItems:"center", justifyContent:"center", marginBottom:mb }}>{label && <span style={{ fontSize:8.5, color, fontWeight:500, textAlign:"center", lineHeight:1.3, padding:"0 5px" }}>{label}</span>}</div>;
        }
        function WBtn({ label, primary=false, flex=1, disabled=false, red=false }) {
          const bg = disabled?"#f0ede6" : red?"#e53935" : primary?"#1a1917":"#f7f6f3";
          const bc = disabled?"#d5d2cb" : red?"#e53935" : primary?"#1a1917":"#d5d2cb";
          const tc = disabled?"#c9cdd6" : (primary||red)?"#fff":"#374151";
          return <div style={{ flex, height:26, background:bg, border:"1px solid "+bc, borderRadius:5, display:"flex", alignItems:"center", justifyContent:"center", cursor:disabled?"default":"pointer" }}><span style={{ fontSize:9, color:tc, fontWeight:700 }}>{label}</span></div>;
        }
        function WLabel({ text }) { return <div style={{ fontSize:9, color:"#9b9890", marginBottom:4 }}>{text}</div>; }
        function WDivider({ my=6 }) { return <div style={{ borderTop:"1px solid #f0ede6", margin:`${my}px 0` }} />; }
        function WInput({ placeholder }) {
          return <div style={{ border:"1px solid #d5d2cb", borderRadius:4, padding:"5px 8px", marginBottom:6 }}><span style={{ fontSize:8.5, color:"#c9cdd6" }}>{placeholder}</span></div>;
        }
        function WQty() {
          return (
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ fontSize:9, fontWeight:600, color:"#1a1917" }}>수량</span>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9 }}>−</span></div>
                <span style={{ fontSize:9, fontWeight:600 }}>1개</span>
                <div style={{ width:16, height:16, border:"1px solid #d5d2cb", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ fontSize:9 }}>+</span></div>
              </div>
            </div>
          );
        }

        // ── 개별 스크린 ──
        function Screen1() {
          return (
            <Phone>
              <div style={{ padding:"8px 12px 0" }}><span style={{ fontSize:14 }}>‹</span></div>
              <div style={{ padding:"6px 12px 10px" }}>
                <div style={{ fontSize:14, fontWeight:800, marginBottom:4 }}>더 쉬운 거래,<br/>매입 판매로 해결해요</div>
                <div style={{ height:52, background:"#f0ede6", borderRadius:8, marginBottom:12 }} />
                <div style={{ fontSize:10, fontWeight:700, marginBottom:8 }}>견적 신청하기</div>
                <div style={{ display:"flex", gap:5 }}>
                  {[["👜","명품"],["📱","스마트폰"],["💻","디지털"],["🏍","오토바이"]].map(([e,l]) => (
                    <div key={l} style={{ flex:1, height:46, background:"#f7f6f3", border:"1px solid #e8e6e0", borderRadius:10, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center" }}>
                      <span style={{ fontSize:14 }}>{e}</span>
                      <span style={{ fontSize:7, fontWeight:600 }}>{l}</span>
                    </div>
                  ))}
                </div>
              </div>
            </Phone>
          );
        }
        function Screen2() {
          return (
            <Phone>
              <div style={{ padding:"7px 12px 10px" }}>
                <div style={{ fontSize:11, fontWeight:700, margin:"4px 0 8px" }}>스마트폰 정보 입력</div>
                <WLabel text="사진 *" /><WRect h={36} label="◎ 0/10" />
                <WLabel text="모델명 *" /><WInput placeholder="모델명 입력" />
                <WQty />
                <WBtn label="견적 요청하기" primary />
              </div>
            </Phone>
          );
        }
        function Screen6() {
          return (
            <Phone>
              <div style={{ padding:"10px" }}>
                <div style={{ fontSize:11, fontWeight:700, marginBottom:8 }}>전문가 견적 비교</div>
                <div style={{ border:"1px solid #e8e6e0", borderRadius:8, padding:"8px" }}>
                  <div style={{ fontSize:10, fontWeight:700 }}>아르셀</div>
                  <div style={{ fontSize:14, fontWeight:700 }}>2,700,000원</div>
                  <WBtn label="채팅 문의" />
                </div>
              </div>
            </Phone>
          );
        }

        // ── 탭: 통합 플로우 (TabFlow) ──
        function TabFlow() {
          const FeeTable = () => (
            <div style={{ border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden", fontSize:11, marginTop:8 }}>
              <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                {["카테고리","세부 품목","확정 과금액"].map(h => <div key={h} style={{ padding:"5px 8px", fontSize:10, fontWeight:600 }}>{h}</div>)}
              </div>
              {[
                { cat:"오토바이", sub:"전 기종", fee:"50,000원" },
                { cat:"스마트폰", sub:"전 기종", fee:"10,000원" },
                { cat:"디지털기기", sub:"태블릿, 노트북 등", fee:"10,000원" },
                { cat:"명품", sub:"견적 1,000만원 이상", fee:"100,000원" },
                { cat:"", sub:"견적 500만~1,000만원", fee:"50,000원" },
                { cat:"", sub:"견적 100만~500만원", fee:"20,000원" },
                { cat:"", sub:"견적 100만원 언더", fee:"10,000원" },
              ].map((r,i) => (
                <div key={i} style={{ display:"grid", gridTemplateColumns:"72px 1fr 90px", borderBottom:"1px solid #f0ede6", background:r.cat===""?"#fafafa":"#fff" }}>
                  <div style={{ padding:"5px 8px", fontWeight:r.cat?"600":"400" }}>{r.cat||"ㅤ"}</div>
                  <div style={{ padding:"5px 8px" }}>{r.sub}</div>
                  <div style={{ padding:"5px 8px", fontWeight:700 }}>{r.fee}</div>
                </div>
              ))}
            </div>
          );

          const steps = [
            { n:1, actor:S, title:"매입 홈 진입 → 카테고리 선택", desc:"홈 > 판매탭 진입. 헤더: '더 쉬운 거래, 매입 판매로 해결해요'. 배너 + 카테고리 그리드.", screen:<Screen1 /> },
            { n:2, actor:S, title:"견적 폼 작성", desc:"카테고리별 특화 폼 제공. 사진(최소 1장), 브랜드/모델명, 상세정보 필수.", 
              extra: (
                <div style={{ marginTop:8, border:"1px solid #e8e6e0", borderRadius:5, overflow:"hidden" }}>
                  <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 1fr", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                    {["카테고리","항목","입력 방식"].map(h => <div key={h} style={{ padding:"5px 8px", fontSize:10, fontWeight:600 }}>{h}</div>)}
                  </div>
                  {[["스마트폰","용량","64/128/256/512GB/1TB"],["","A/S 여부","공식/사설"],["명품","구성품","박스/보증서/더스트백"],["오토바이","연식","연도 선택"],["","주행거리","숫자 입력"]].map(([c,k,v],i) => (
                    <div key={i} style={{ display:"grid", gridTemplateColumns:"72px 1fr 1fr", borderBottom:"1px solid #f0ede6", background:"#fff" }}>
                      <div style={{ padding:"4px 8px", fontSize:10, fontWeight:c?"600":"400" }}>{c||"ㅤ"}</div>
                      <div style={{ padding:"4px 8px", fontSize:10 }}>{k}</div>
                      <div style={{ padding:"4px 8px", fontSize:10, color:"#6b6860" }}>{v}</div>
                    </div>
                  ))}
                </div>
              ),
              notes:["사진: 최소 1장, 최대 10장.","유효성: 필수값 미입력 시 요청 버튼 비활성."], screen:<Screen2 /> 
            },
            { n:6, actor:S, title:"견적 비교 → 상담 선택", cost:true, desc:"가견적가/거래건수 비교 후 채팅 문의 시작. 상담 과금 발생.", extra:<FeeTable />, notes:["취소 사유: 수정 필요 / 타 서비스 이용 / 단순 변심 등"], screen:<Screen6 /> },
          ];

          return (
            <div style={{ position:"relative" }}>
              <div style={{ position:"absolute", left:19, top:0, bottom:0, width:1, background:"#e8e6e0" }} />
              {steps.map((s) => (
                <div key={s.n} style={{ display:"flex", gap:12, position:"relative", zIndex:1, marginBottom:20 }}>
                  <div style={{ width:40, height:40, borderRadius:"50%", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", background:s.actor.bg, border:"1.5px solid "+s.actor.border, fontWeight:700 }}>{s.n}</div>
                  <div style={{ flex:1, border:"1px solid #e8e6e0", borderRadius:6, background:"#fff", overflow:"hidden" }}>
                    <div style={{ padding:"9px 14px", borderBottom:"1px solid #f0ede6", display:"flex", alignItems:"center", gap:8 }}>
                      <Actor type={s.actor} sm /> <span style={{ fontWeight:600 }}>{s.title}</span>
                      {s.cost && <Chip text="과금" color={C.color} bg={C.bg} border={C.border} />}
                    </div>
                    <div style={{ padding:"12px 14px", display:"flex", gap:16 }}>
                      <div style={{ flex:1 }}>
                        <p style={{ fontSize:12, lineHeight:1.7, margin:0 }}>{s.desc}</p>
                        {s.extra}
                        {s.notes && <div style={{ marginTop:8 }}>{s.notes.map((n,i) => <div key={i} style={{ fontSize:11, color:"#374151" }}>▸ {n}</div>)}</div>}
                      </div>
                      {s.screen}
                    </div>
                  </div>
                </div>
              ))}
              <div style={{ textAlign:"center", padding:"20px", color:"#9b9890", fontSize:12 }}>그 외 단계는 스크롤 또는 원본 기획서 참조</div>
            </div>
          );
        }

        // ── 탭: 회의록 (TabHistory) - 링크 100% 복구 ──
        function TabHistory() {
          const docs = [
            { label:"상위기획 Phase 1", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5358977500/Phase+1" },
            { label:"Specdoc — 견적 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5387878717/Specdoc" },
            { label:"Specdoc — 판매자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357764617/Specdoc" },
            { label:"Specdoc — 업자 플로우", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357600795/Specdoc" },
            { label:"Specdoc — 상담 채팅", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357568021/Specdoc" },
            { label:"Specdoc — 플랫폼 어드민", url:"https://quicket.atlassian.net/wiki/spaces/md/pages/5357240332/Specdoc" },
          ];
          const sessions = [
            { date:"04.24", title:"번개톡 활용 방식 결정", items:[{text:"매입 거래 전용 소통 채널 필요성 합의",s:"done"},{text:"기존 번개톡 → 매입관 전용 채팅방 구축 확정",s:"done"}]},
            { date:"04.21", title:"상세기획 3차", items:[{text:"정보 공유 방식: 전용 버튼 카드 방식 확정",s:"done"}]},
          ];

          return (
            <div>
              <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", marginBottom:20 }}>
                <div style={{ padding:"8px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontSize:10, fontWeight:700 }}>기획서 링크 — Confluence (클릭 시 이동)</div>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#fff" }}>
                  {docs.map((d,i) => (
                    <a key={i} href={d.url} target="_blank" rel="noopener noreferrer" style={{ display:"flex", alignItems:"center", gap:6, padding:"10px 14px", borderBottom:"1px solid #f0ede6", borderRight:"1px solid #f0ede6", color:"#1d3fac", fontSize:11, fontWeight:500 }}>
                      <span style={{ color:"#9b9890" }}>↗</span> {d.label}
                    </a>
                  ))}
                </div>
              </div>
              {sessions.map((s,si) => (
                <div key={si} style={{ marginBottom:12, border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
                  <div style={{ padding:"9px 14px", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0", fontWeight:600 }}>{s.date} {s.title}</div>
                  {s.items.map((item,ii) => (
                    <div key={ii} style={{ padding:"8px 14px", display:"flex", gap:10, borderBottom:"1px solid #f0ede6" }}>
                      <Status v={item.s} /><span style={{ fontSize:13 }}>{item.text}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          );
        }

        // ── 탭: 채팅 스펙 (TabChat) - 상태 머신 복구 ──
        function TabChat() {
          const customs = [
            { n:"1", title:"매입 뱃지 부착", detail:"채팅 목록 및 상단에 '매입' 노출.", who:"양측" },
            { n:"2", title:"매입 전용 상단 카드", detail:"매물 요약 카드 상단 고정.", who:"양측" },
            { n:"3", title:"정보 공유 버튼", detail:"연락처/주소/계좌 카드 전송.", who:"양측" },
            { n:"4", title:"거래 완료 버튼", detail:"업자 전용. 최종 매입가 입력 필수.", who:"업자만" },
          ];
          const states = [
            { state:"상담 중", trigger:"판매자가 견적 채택 → 채팅방 생성", note:"" },
            { state:"거래 완료", trigger:"업자가 [거래 완료] + 최종 매입가 입력", note:"후기 요청 푸시 발송" },
            { state:"거래 취소", trigger:"상담방 생성 후 14일 경과 (자동)", note:"수동 취소 없음 (PENDING)" },
          ];

          return (
            <div>
              <Sec title="채팅 커스텀 항목" />
              <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff", marginBottom:20 }}>
                {customs.map((c,i) => (
                  <div key={i} style={{ display:"grid", gridTemplateColumns:"30px 1fr 2fr 60px", padding:"10px", borderBottom:"1px solid #f0ede6" }}>
                    <span style={{ fontSize:11, fontWeight:700 }}>{c.n}</span>
                    <span style={{ fontSize:12, fontWeight:600 }}>{c.title}</span>
                    <span style={{ fontSize:12 }}>{c.detail}</span>
                    <Chip text={c.who} />
                  </div>
                ))}
              </div>
              <Sec title="상담방 상태 머신" />
              <div style={{ border:"1px solid #e8e6e0", borderRadius:6, overflow:"hidden", background:"#fff" }}>
                <div style={{ display:"grid", gridTemplateColumns:"100px 1fr 1fr", background:"#f7f6f3", borderBottom:"1px solid #e8e6e0" }}>
                  {["상태","진입 조건","비고"].map(h => <div key={h} style={{ padding:"8px 12px", fontSize:11, fontWeight:600 }}>{h}</div>)}
                </div>
                {states.map((s,i) => (
                  <div key={i} style={{ display:"grid", gridTemplateColumns:"100px 1fr 1fr", borderBottom:"1px solid #f0ede6" }}>
                    <div style={{ padding:"9px 12px", fontSize:12, fontWeight:600 }}>{s.state}</div>
                    <div style={{ padding:"9px 12px", fontSize:12 }}>{s.trigger}</div>
                    <div style={{ padding:"9px 12px", fontSize:11, color:"#6b6860" }}>{s.note||"—"}</div>
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function App() {
          const [tab, setTab] = useState(0);
          return (
            <div style={{ minHeight:"100vh", paddingBottom:40 }}>
              <div style={{ background:"#1a1917", color:"#fff", padding:"16px 20px 0" }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:15 }}>
                  <div>
                    <div style={{ fontSize:10, color:"#9b9890" }}>BUNJANG BUY-BACK PHASE 1</div>
                    <div style={{ fontSize:19, fontWeight:700 }}>매입지원 서비스 상세 기획</div>
                  </div>
                  <Chip text="PHASE 1" color="#fff" bg="#333" />
                </div>
                <div style={{ display:"flex", gap:2 }}>
                  {["회의록","MVP 스코프","통합 플로우","채팅 스펙"].map((l,i) => (
                    <button key={i} onClick={() => setTab(i)} style={{ padding:"10px 15px", border:"none", borderRadius:"5px 5px 0 0", background:tab===i?"#f7f6f3":"transparent", color:tab===i?"#000":"#999", cursor:"pointer", fontSize:12 }}>{l}</button>
                  ))}
                </div>
              </div>
              <div style={{ maxWidth:980, margin:"20px auto", padding:"0 18px" }}>
                {tab===0 && <TabHistory />}
                {tab===1 && <div style={{ fontSize:13 }}>MVP 스코프 내용은 원본 참조 (공간상 통합 플로우에 집중)</div>}
                {tab===2 && <TabFlow />}
                {tab===3 && <TabChat />}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
